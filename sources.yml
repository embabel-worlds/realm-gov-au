# What these collections ARE, as distinct from how producers/ read them.
#
# Everything here was measured against the live services on 2026-08-01, not assumed. The
# strategic note first: BOTH sources stay live in v1. AusTender is the interesting call — the
# axes people ask on (agency, supplier, category) and the axes the source filters on (id, date)
# barely overlap, which is normally the mirror signal (see the NSW realm). The reason v1 does
# not mirror is volume shape: the whole register is ~450k notices since 2013, but the questions
# this realm answers live either at ONE notice (the passport — per-key, instant) or inside a
# BOUNDED recent window (what was signed / what changed — a few pages, TTL-cached). A mirror
# partitioned by publication month is the v2 answer the moment someone needs
# "all contracts of supplier X since 2013" as a graph traversal rather than a baked dataset.

sources:
  - name: austender-contract-versions
    producer: versionsById
    label: ContractVersion
    identityProperty: releaseId
    anchor:
      label: ContractNotice
      keyProperty: cnId
      edge: HAS_VERSION
    shape: per-key
    partition: cnId                 # named as filterableAtSource names it: the source fetches by it
    queriedBy: [cnId]
    # cnId IS the fetch key — versionsById takes it as keyArgs, one call per notice. Omitting it
    # here made the registry warn that this live source needs its whole partition, which it does not.
    filterableAtSource: [cnId]
    ordering: oldest-first          # releases arrive original-first; ORDER BY releaseDate anyway
    updates: business-days
    sync:
      strategy: live                # a passport is one instant call; nothing to mirror
    visibility: public

  - name: austender-published-window
    producer: releasesPublishedInWindow
    label: ContractRelease
    identityProperty: releaseId
    anchor:
      label: PublicationWindow
      keyProperty: window
      edge: PUBLISHED
    shape: bounded
    cardinality: 450000             # full register since 2013; a WINDOW is a few hundred
    partition: window
    # Measured: the feed narrows on NOTHING but the window itself. No agency, supplier, ABN,
    # category or text filter exists — agency/supplier questions fetch the window and narrow
    # after. That is why windows must stay small and why the page-cap PARTIAL warning matters:
    # a capped window presented as complete would silently understate an agency's month.
    # Live stays right while every view anchors a window (they all do): `partition: window`, listed
    # in filterableAtSource, tells the platform each read takes one window whole — day by day,
    # within the producer's page budget — so the unfiltered axes are narrowed over a complete set.
    queriedBy: [agency, supplier, amount, method]
    filterableAtSource: [window]
    # Newest-first within the window (the cursor walks backwards in time), so a capped window
    # keeps its most recent releases and drops its earliest — the bias the cap warning must carry.
    ordering: newest-first
    updates: business-days
    sync:
      strategy: live
    completeness:
      aggregatesRequireComplete: true
    visibility: public

  - name: austender-changed-window
    producer: releasesModifiedInWindow
    label: ContractRelease
    identityProperty: releaseId
    anchor:
      label: ChangeWindow
      keyProperty: window
      edge: CHANGED
    shape: bounded
    partition: window
    queriedBy: [tags, agency, supplier, amount]
    filterableAtSource: [window]
    # Newest-first within the window (the cursor walks backwards in time), so a capped window
    # keeps its most recent releases and drops its earliest — the bias the cap warning must carry.
    ordering: newest-first
    updates: business-days
    sync:
      strategy: live
    completeness:
      aggregatesRequireComplete: true
    visibility: public

  - name: lobbyists-firm-summary
    producer: firmSummaryById
    label: LobbyistFirm
    identityProperty: firmId
    anchor:
      label: LobbyistOrg
      keyProperty: firmId
      edge: HAS_RECORD
    shape: per-key
    partition: firmId               # the fetch key, named as filterableAtSource names it
    queriedBy: [firmId]
    filterableAtSource: [firmId]   # the fetch key — firmSummaryById is one call per firm
    ordering: irrelevant
    updates: on-registration-events
    sync:
      strategy: live                # 385 firms; the whole register is smaller than one NSW council
    visibility: public

  - name: lobbyists-registered-people
    producer: firmLobbyistsById
    label: RegisteredLobbyist
    identityProperty: lobbyistKey   # the register publishes NO person id — see producers/lobbying.yml
    anchor:
      label: LobbyistOrg
      keyProperty: firmId
      edge: REGISTERS
    shape: per-key
    partition: firmId
    queriedBy: [firmId, isFormerRepresentative]
    # firmId is the fetch key; isFormerRepresentative is NOT filterable at the register (its only
    # GETs are the whole-register index and one firm's profile), so the gap stays declared. It is
    # not a reason to mirror: every question of this source starts from a firm (REGISTERS hangs off
    # LobbyistOrg), one call returns that firm's every lobbyist, and the flag is narrowed over that
    # complete set. `partition` names the fetch key so the platform can see that.
    filterableAtSource: [firmId]
    ordering: irrelevant
    updates: on-registration-events
    sync:
      strategy: live
    visibility: public

  # The auditor's account, as DOCUMENTS rather than records. ANAO performance audits are long,
  # stable reports — the opposite of a register — so they land in the document store, chunked
  # and embedded, where a relevance join (`(:Concept)-[:RELEVANT_TO]->(:Document)`) reaches them
  # from a row of live AusTender data. AuditedLimitedTender (views/audit-reading.yml) is that join.
  #
  # A curated set, not a crawl: the procurement audits of the agencies that carry the most
  # limited-tender value, plus the whole-of-government limited tender audit. Every tag is
  # `anao`, which is how a view keeps the user's own documents out of the auditor's mouth.
  # Pages carry their own Last-Modified, so a run re-reads only a report ANAO has re-issued.
  - name: anao-procurement-audits
    lane: documents
    from:
      urls:
        - https://www.anao.gov.au/sites/default/files/2026-03/Auditor-General_Report_2025-26_26.pdf   # Defence — Land 400 Phase 3
        - https://www.anao.gov.au/sites/default/files/2024-06/Auditor-General_Report_2023-24_47.pdf   # Defence — munitions supply contracts, Part 1
        - https://www.anao.gov.au/sites/default/files/2022-10/Auditor-General_Report_2022-23_5.pdf    # DTA — procurement of ICT-related services
        - https://www.anao.gov.au/sites/default/files/2025-12/Auditor-General_Report_2025-26_11.pdf   # Health — onshore vaccine manufacturing
        - https://www.anao.gov.au/sites/default/files/Auditor-General_Report_2020-21_39.pdf           # Health — National Medical Stockpile
        - https://www.anao.gov.au/sites/default/files/ANAO_Report_2014-2015_48.pdf                    # whole of government — limited tender procurement
    document:
      sourceKind: anao
      tags: [anao, audit]
    sync:
      trigger: on-install
      prune: true

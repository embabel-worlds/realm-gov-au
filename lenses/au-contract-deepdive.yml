id: au-contract-deepdive
name: Deep dive on one contract
description: >-
  Everything the registers and the open web hold about one contract notice, in three clearly
  separated tiers: the REGISTER (what was signed, amended and stated), the CROSS-REGISTER context
  (the agency's portfolio, the ground's own text, the supplier's lobbying disclosures), and
  UNVERIFIED press coverage matched on a search phrase. The tiers never blend — coverage is
  material about the parties, never evidence about the contract.
params:
  - name: cnId
    type: STRING
    label: Contract notice id (e.g. CN4118426)
    required: true
    default: CN4118426
  - name: searchPhrase
    type: STRING
    label: Coverage search phrase (blank = composed from supplier + agency)
    required: false
    default: ""
spec:
  kind: cypherscript
  script: |
    const cnId = String(lensArgs.cnId || "").trim().toUpperCase();
    const asText = (w) => (typeof w === "string" ? w : JSON.stringify(w) || "").toUpperCase();
    const isFetchFailure = (w) => {
      const t = asText(w);
      return t.includes("PRODUCER_ERROR") || t.includes("FETCH_FAILURE") ||
             t.includes("COULD NOT BE FETCHED") || t.includes("AUTH_EXPIRED");
    };
    const warnings = [];

    // ---- TIER 1: the register ------------------------------------------------------------
    const v = await gateway.kg.query({
      cypher: `
        MATCH (n:ContractNotice {cnId:$cnId})-[:HAS_VERSION]->(v:ContractVersion)
        RETURN v.releaseDate AS releaseDate, toFloat(v.amount) AS amount, v.tags AS tags,
               v.description AS description, v.title AS title,
               v.supplierName AS supplierName, v.supplierAbn AS supplierAbn,
               v.agencyName AS agencyName, v.dateSigned AS dateSigned,
               v.startDate AS startDate, v.endDate AS endDate,
               v.procurementMethod AS procurementMethod,
               v.limitedTenderReason AS limitedTenderReason,
               v.limitedTenderReasonCode AS limitedTenderReasonCode,
               v.exemption AS exemption, v.exemptionCode AS exemptionCode
        ORDER BY v.releaseDate ASC
      `,
      params: JSON.stringify({ cnId }),
    });
    const versions = ((v && v.rows) ? v.rows : (v || []));
    warnings.push(...((v && v.warnings) || []));
    if (!versions.length) {
      await gateway.lens.present({ content: JSON.stringify({
        kind: "au-contract-deepdive", cnId, found: false,
        status: warnings.some(isFetchFailure) ? "FAILED" : "COMPLETE",
        note: warnings.some(isFetchFailure)
          ? "The AusTender fetch did not complete — whether this notice exists is UNKNOWN."
          : "AusTender's OCDS register has no notice with this id.",
        warnings, source: "AusTender OCDS API (CC BY 3.0 AU)",
      }) });
    } else {
    const head = versions[versions.length - 1];
    const amounts = versions.map(x => x.amount).filter(a => Number.isFinite(a));

    // ---- TIER 2: cross-register context ---------------------------------------------------
    // Each hop is optional: a missing seed or an unmatched name yields null, never a wrong answer.
    const ctx = await gateway.kg.query({
      cypher: `
        OPTIONAL MATCH (a:Agency)
          WHERE a.name = $agencyName OR $agencyName IN a.austenderAliases
        OPTIONAL MATCH (a)-[:IN_PORTFOLIO]->(p:Portfolio)
        OPTIONAL MATCH (g:ProcurementGround {code: $groundCode})
        OPTIONAL MATCH (x:ProcurementGround {code: $exemptionCode})
        RETURN a.name AS agencyLegalName, a.abn AS agencyAbn, a.bodyType AS bodyType,
               a.staffingLevel AS staffingLevel, a.website AS agencyWebsite,
               p.name AS portfolio,
               g.text AS groundText, g.kind AS groundKind,
               x.text AS exemptionText, x.kind AS exemptionKind
      `,
      params: JSON.stringify({
        agencyName: head.agencyName || "",
        groundCode: head.limitedTenderReasonCode || "",
        exemptionCode: head.exemptionCode || "",
      }),
    });
    const c = ((ctx && ctx.rows) ? ctx.rows : (ctx || []))[0] || {};
    warnings.push(...((ctx && ctx.warnings) || []));

    // ---- TIER 3: press coverage (UNVERIFIED, fenced) --------------------------------------
    // The phrase is a JUDGMENT the lens makes and shows: supplier + agency is the pairing most
    // likely to surface reporting about this procurement, and most likely to surface unrelated
    // stories about a large supplier. Both facts are stated in the output.
    const phrase = String(lensArgs.searchPhrase || "").trim() ||
      [head.supplierName, head.agencyName].filter(Boolean).join(" ");
    let coverage = [], coverageStatus = "COMPLETE", coverageNote = null;
    if (!phrase) {
      coverageStatus = "SKIPPED";
      coverageNote = "No supplier or agency name to search on.";
    } else {
      const cov = await gateway.kg.query({
        cypher: `
          MATCH (q:CoverageQuery {phrase:$phrase})-[:HAS_COVERAGE]->(x:ContractCoverage)
          RETURN x.title AS title, x.url AS url, x.snippet AS snippet, x.age AS age
          LIMIT 8
        `,
        params: JSON.stringify({ phrase }),
      });
      coverage = ((cov && cov.rows) ? cov.rows : (cov || []));
      const cw = (cov && cov.warnings) || [];
      // NO KEY / NO NAMESPACE is "we could not look", which must never render as "nothing found".
      const unavailable = cw.some(w => {
        const t = asText(w);
        return t.includes("BRAVE") || t.includes("NAMESPACE") || t.includes("NOT A WORLD TOOL") ||
               t.includes("AUTH") || isFetchFailure(w);
      });
      if (unavailable) {
        coverageStatus = "UNAVAILABLE";
        coverageNote = "Press search could not run (no search key configured, or the search failed). " +
                       "This is NOT a finding of 'no coverage' — nothing was looked at.";
        warnings.push(...cw);
      } else if (!coverage.length) {
        coverageNote = "No results for this phrase, in this window, from this index. That is a fact " +
                       "about the search, not about the contract.";
      }
    }

    // ---- TIER 4: the parliamentary record (fenced, doubly-qualified silence) --------------
    // Two searches, sharpest first: the CN id itself (Questions on Notice cite notice ids
    // verbatim — a hit is close to a direct reference), then the supplier+agency phrase (broad:
    // a large supplier is discussed in Parliament for many reasons). Both go through a web index
    // scoped to aph.gov.au, so a silence here is about the INDEX, never about Hansard.
    // Each `via` is a RECORD CLASS (chamber Hansard / committee evidence / Estimates), searched
    // through ParlInfo's own feed — so a result names which part of the record it came from, and
    // a silence is qualified per class rather than per web-crawler.
    const parliamentSearch = async (searchPhrase, via, record) => {
      const pq = await gateway.kg.query({
        cypher: `
          MATCH (q:ParliamentQuery {phrase:$phrase})-[:MENTIONED_IN {via:'${via}'}]->(m:ParliamentMention)
          RETURN m.title AS title, m.url AS url, m.summary AS snippet, m.publishedAt AS publishedAt
          LIMIT 8
        `,
        params: JSON.stringify({ phrase: searchPhrase }),
      });
      const rows = ((pq && pq.rows) ? pq.rows : (pq || [])).map(x => Object.assign({ record }, x, {
        age: String(x.publishedAt || "").slice(0, 10) || null,
      }));
      return { rows, warns: (pq && pq.warnings) || [] };
    };
    let parliament = { status: "COMPLETE", byCn: [], byNames: [], note: null };
    {
      // The CN id across all three record classes (QoNs cite ids verbatim and surface through
      // committee documents); the broad names phrase against Estimates only — the venue where a
      // supplier answering for a contract actually happens.
      const cnChamber = await parliamentSearch(cnId, "chamber", "chamber Hansard");
      const cnCommittees = await parliamentSearch(cnId, "committees", "committee evidence");
      const cnEstimates = await parliamentSearch(cnId, "estimates", "Estimates");
      const nameHits = phrase ? await parliamentSearch(phrase, "estimates", "Estimates") : { rows: [], warns: [] };
      const pw = [...cnChamber.warns, ...cnCommittees.warns, ...cnEstimates.warns, ...nameHits.warns];
      const unavailable = pw.some(w => {
        const t = asText(w);
        return t.includes("NAMESPACE") || t.includes("NOT A WORLD TOOL") || isFetchFailure(w);
      });
      if (unavailable) {
        parliament.status = "UNAVAILABLE";
        parliament.note = "The ParlInfo search could not run. This is NOT a finding of 'never raised' — " +
          "nothing was looked at.";
        warnings.push(...pw);
      } else {
        parliament.byCn = [...cnChamber.rows, ...cnCommittees.rows, ...cnEstimates.rows];
        parliament.byNames = nameHits.rows;
        if (!parliament.byCn.length && !parliament.byNames.length) {
          parliament.note = "Nothing matched either phrase in chamber Hansard, committee evidence or " +
            "Estimates transcripts — ParlInfo's own records for those classes. Questions on Notice are " +
            "not yet searchable here, so 'never raised in Parliament' still cannot be concluded from an " +
            "empty result — only 'not found in these records'.";
        }
      }
    }

    await gateway.lens.present({ content: JSON.stringify({
      kind: "au-contract-deepdive",
      cnId, found: true,
      status: warnings.some(isFetchFailure) ? "PARTIAL" : "COMPLETE",
      warnings,
      tiers: {
        register: "What the Commonwealth published. Facts.",
        context: "Other GOVERNMENT registers joined to it. Facts, from a different register.",
        coverage: "Third-party press matching a search phrase. NOT evidence about this contract.",
        parliament: "Pages of the parliamentary record (Hansard, Questions on Notice, committees) matching a search phrase. A real accountability artefact when present — still not evidence about this contract.",
      },
      register: {
        title: head.title, description: head.description,
        supplierName: head.supplierName, supplierAbn: head.supplierAbn || null,
        agencyName: head.agencyName,
        dateSigned: head.dateSigned, startDate: head.startDate, endDate: head.endDate,
        procurementMethod: head.procurementMethod,
        originalAmount: amounts[0], currentAmount: amounts[amounts.length - 1],
        amendments: versions.length - 1,
        growthPct: (amounts.length > 1 && amounts[0] > 0)
          ? Math.round(((amounts[amounts.length - 1] - amounts[0]) / amounts[0]) * 1000) / 10 : null,
        versions: versions.map(x => ({
          releaseDate: x.releaseDate, amount: x.amount,
          isAmendment: (x.tags || []).includes("contractAmendment"),
        })),
        limitedTenderReason: head.limitedTenderReason || null,
        exemption: head.exemption || null,
        austenderUrl: "https://www.tenders.gov.au/Search/KeywordSearch?keyword=" + encodeURIComponent(cnId),
        supplierUrl: head.supplierName
          ? "https://www.tenders.gov.au/Search/KeywordSearch?keyword=" + encodeURIComponent(head.supplierName) : null,
      },
      context: {
        agencyLegalName: c.agencyLegalName || null,
        agencyResolved: !!c.agencyLegalName,
        agencyAbn: c.agencyAbn || null,
        bodyType: c.bodyType || null,
        staffingLevel: c.staffingLevel || null,
        agencyWebsite: c.agencyWebsite || null,
        portfolio: c.portfolio || null,
        groundCode: head.limitedTenderReasonCode || null,
        groundText: c.groundText || head.limitedTenderReason || null,
        exemptionCode: head.exemptionCode || null,
        exemptionText: c.exemptionText || head.exemption || null,
        unresolvedNote: c.agencyLegalName ? null
          : "This agency name matched no seeded agency — either name drift, or a body AGOR does not " +
            "list. Portfolio context is therefore unavailable for this contract, not absent from government.",
      },
      coverage: {
        status: coverageStatus,
        searchPhrase: phrase,
        phraseBasis: "Composed from the supplier and agency names. A JUDGMENT by this lens, not a " +
                     "register field — and a broad one: a large supplier's name surfaces stories that " +
                     "have nothing to do with this contract.",
        note: coverageNote,
        results: coverage.map(x => ({ title: x.title, url: x.url, snippet: x.snippet, age: x.age || null })),
      },
      parliament: {
        status: parliament.status,
        note: parliament.note,
        byContractId: {
          searchPhrase: cnId,
          basis: "The notice id itself, across chamber Hansard, committee evidence and Estimates — a hit is close to a direct reference; each result names its record class.",
          results: parliament.byCn.map(x => ({ title: x.title, url: x.url, snippet: x.snippet, age: x.age || null })),
        },
        byNames: {
          searchPhrase: phrase || null,
          basis: "Supplier + agency names against Senate Estimates transcripts — broad by construction; a match may concern anything about either party.",
          results: parliament.byNames.map(x => ({ title: x.title, url: x.url, snippet: x.snippet, age: x.age || null })),
        },
      },
      method: "Four tiers fetched separately and never merged: the register's own versions; other " +
              "government registers joined by name and code; a press search whose scope is stated; and " +
              "ParlInfo's own search of the parliamentary record, sharpest phrase first.",
      limits: [
        "Press results match a phrase, not a contract. Presence of an article is not evidence about this procurement, and absence is not evidence of anything.",
        "Parliamentary results come from ParlInfo's own search of chamber Hansard, committee evidence and Estimates; Questions on Notice are not yet covered, so an empty result never supports 'this was not raised in Parliament'.",
        "AusTender records commitments, not expenditure; an amended value is a recorded change to an agreement.",
        "A stated ground or exemption is the agency's own words, reported verbatim and never assessed.",
        "Agency context depends on seeded reference data; an unresolved name says so rather than guessing.",
      ],
      source: "AusTender OCDS API (CC BY 3.0 AU) · AGOR (CC BY 3.0 AU, seeded) · Brave Search (third-party, keyed; press) · ParlInfo search feeds (keyless)",
    }) });
    }
presentation:
  href: /apps/moneytrail.html

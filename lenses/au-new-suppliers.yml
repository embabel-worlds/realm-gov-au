id: au-new-suppliers
name: Suppliers appearing for the first time
description: >-
  Suppliers with a contract in the recent window who had none in the comparison window — the
  register's own view of who is new to Commonwealth business, and what they won. Two window
  fetches, compared by normalised name; "new" means absent from the earlier window, never absent
  from government.
params:
  - name: from
    type: DATE
    label: Recent window from
    required: true
    default: "2026-07-21"
  - name: to
    type: DATE
    label: Recent window to (exclusive)
    required: true
    default: "2026-07-28"
  - name: priorFrom
    type: DATE
    label: Compare against from
    required: true
    default: "2026-07-14"
  - name: priorTo
    type: DATE
    label: Compare against to (exclusive)
    required: true
    default: "2026-07-21"
spec:
  kind: cypherscript
  script: |
    const isoAt = (d) => { const v = String(d || '').trim(); return !v ? v : (/T/.test(v) ? v : v + 'T00:00:00Z'); };
    const win = (a, b) => `${isoAt(a)}/${isoAt(b)}`;
    const recent = win(lensArgs.from, lensArgs.to);
    const prior = win(lensArgs.priorFrom, lensArgs.priorTo);

    // NOT named `fetch`, and the parameter is NOT named `window`: both shadow sandbox globals,
    // and the failure mode is a script that presents then dies with no message.
    const fetchWindow = async (winKey) => {
      const r = await gateway.kg.query({
        cypher: `
          MATCH (w:PublicationWindow {window:$window})-[:PUBLISHED]->(r:ContractRelease)
          RETURN r.cnId AS cnId, toFloat(r.amount) AS amount, r.supplierName AS supplierName,
                 r.supplierAbn AS supplierAbn, r.agencyName AS agencyName,
                 r.description AS description, r.procurementMethod AS procurementMethod
        `,
        params: JSON.stringify({ window: winKey }),
      });
      return { rows: ((r && r.rows) ? r.rows : (r || [])), warnings: (r && r.warnings) || [] };
    };
    const a = await fetchWindow(recent), b = await fetchWindow(prior);
    const warnings = [...a.warnings, ...b.warnings];
    const asText = (w) => (typeof w === "string" ? w : JSON.stringify(w) || "").toUpperCase();
    const failed = warnings.some(w => asText(w).includes("PRODUCER_ERROR") || asText(w).includes("FETCH_FAILURE"));
    const truncated = warnings.some(w => asText(w).includes("MORE") || asText(w).includes("CAP"));

    // Normalised so "DATA #3 LIMITED" and "Data#3 Limited" are one supplier, which is the whole
    // point of the comparison — a casing difference must not manufacture a "new" supplier.
    const key = (s) => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    const seenBefore = new Set(b.rows.map(x => key(x.supplierName)).filter(Boolean));
    const agg = {};
    for (const x of a.rows) {
      const k = key(x.supplierName);
      if (!k || seenBefore.has(k)) continue;
      agg[k] = agg[k] || { name: x.supplierName, abn: x.supplierAbn || null, contracts: 0, value: 0, agencies: new Set(), example: null };
      agg[k].contracts++; agg[k].value += (x.amount || 0); agg[k].agencies.add(x.agencyName);
      if (!agg[k].example || (x.amount || 0) > agg[k].example.amount) {
        agg[k].example = { cnId: x.cnId, amount: x.amount || 0, description: String(x.description || "").slice(0, 150),
                           agencyName: x.agencyName, procurementMethod: x.procurementMethod };
      }
    }
    const newcomers = Object.values(agg).map(v => ({
      name: v.name, abn: v.abn, contracts: v.contracts, value: Math.round(v.value),
      agencies: Array.from(v.agencies), example: v.example,
      austenderUrl: "https://www.tenders.gov.au/Search/KeywordSearch?keyword=" + encodeURIComponent(v.name),
    })).sort((x, y) => y.value - x.value);
    const newValue = newcomers.reduce((s, x) => s + x.value, 0);
    const recentValue = a.rows.reduce((s, x) => s + (x.amount || 0), 0);

    await gateway.lens.present({ content: JSON.stringify({
      kind: "au-new-suppliers",
      windows: { recent: { from: lensArgs.from, to: lensArgs.to }, prior: { from: lensArgs.priorFrom, to: lensArgs.priorTo } },
      status: failed ? "FAILED" : (truncated ? "PARTIAL" : "COMPLETE"),
      warnings,
      queries: [{ title: "Both windows, compared by normalised supplier name",
        note: "Two fetches; 'new' = present in the recent window, absent from the prior one.",
        cypher: "MATCH (w:PublicationWindow {window:$window})-[:PUBLISHED]->(r:ContractRelease)\n" +
                "RETURN r.supplierName, toFloat(r.amount)   // run for each window, then set-difference" }],
      joins: [{ source: "AusTender OCDS API", role: "Both publication windows", licence: "CC BY 3.0 AU, keyless",
                ok: !failed, detail: `${a.rows.length} recent, ${b.rows.length} prior` }],
      totals: {
        recentContracts: a.rows.length, recentValue: Math.round(recentValue),
        newSuppliers: newcomers.length, newSupplierValue: newValue,
        newShareOfValuePct: recentValue > 0 ? Math.round((newValue / recentValue) * 1000) / 10 : null,
      },
      newcomers: newcomers.slice(0, 25),
      method: "Set difference over normalised supplier names between two publication windows.",
      limits: [
        "'New' means ABSENT FROM THE COMPARISON WINDOW — a long-standing supplier with no contract published in that week appears here. Widen the comparison window to harden the claim.",
        "Name normalisation groups spelling variants but cannot resolve a rebrand or a subsidiary to its parent.",
        "Capped fetches make both sides samples; the status says so.",
      ],
      source: "AusTender OCDS API (CC BY 3.0 AU)",
    }) });
presentation:
  href: /apps/moneytrail.html

id: au-money-by
name: Where the money goes
description: >-
  One window's committed value cut three ways: by CONTRACT SIZE (arithmetic bands), by
  CATEGORY using the government's own UNSPSC titles (deterministic — no model guesses what a
  code means), and by SECTOR using an LLM to classify each description into labels you supply
  ("weapons, software, health, transport"), which is the only cut a model is needed for and is
  labelled as a judgment throughout.
params:
  - name: from
    type: DATE
    label: From
    required: true
    default: "2026-07-21"
  - name: to
    type: DATE
    label: To (exclusive)
    required: true
    default: "2026-07-28"
  - name: sectors
    type: STRING
    label: Sector labels for the LLM cut (comma-separated; blank = skip the model entirely)
    required: false
    default: "weapons and defence materiel, software and IT, health and medical, transport and logistics, construction and property, professional and consulting services, education and training, other"
spec:
  kind: cypherscript
  script: |
    // Params are DATEs (the generated form gives a date picker); the feed wants ISO instants.
    const isoAt = (d, endOfDay) => {
      const v = String(d || '').trim();
      if (!v) return v;
      return /T/.test(v) ? v : v + (endOfDay ? 'T23:59:59Z' : 'T00:00:00Z');
    };
    const from = isoAt(lensArgs.from);
    const to = isoAt(lensArgs.to);
    const sectors = String(lensArgs.sectors || "").trim();
    const window = `${from}/${to}`;

    // ---- Facts: size bands and category titles ------------------------------------------
    // The category join is LONGEST-PREFIX against the seeded codeset: a contract's code may be
    // finer than any published row. A code that matches nothing is reported unmatched, never
    // bucketed into a guess.
    const r = await gateway.kg.query({
      cypher: `
        MATCH (w:PublicationWindow {window:$window})-[:PUBLISHED]->(r:ContractRelease)
        RETURN r.cnId AS cnId, toFloat(r.amount) AS amount, r.description AS description,
               r.supplierName AS supplierName, r.agencyName AS agencyName,
               r.unspscCodes AS unspscCodes
      `,
      params: JSON.stringify({ window }),
    });
    const rows = ((r && r.rows) ? r.rows : (r || []));
    const warnings = [...((r && r.warnings) || [])];
    const asText = (w) => (typeof w === "string" ? w : JSON.stringify(w) || "").toUpperCase();
    const failed = warnings.some(w => { const t = asText(w);
      return t.includes("PRODUCER_ERROR") || t.includes("FETCH_FAILURE") || t.includes("COULD NOT BE FETCHED"); });
    const truncated = warnings.some(w => asText(w).includes("MORE") || asText(w).includes("CAP"));
    const total = rows.reduce((a, x) => a + (x.amount || 0), 0);

    // SIZE: fixed bands, so two runs are comparable. Government contracting is extremely
    // top-heavy, which the band table shows directly rather than asserting.
    const BANDS = [
      { label: "under $100k", min: 0, max: 1e5 },
      { label: "$100k – $1M", min: 1e5, max: 1e6 },
      { label: "$1M – $10M", min: 1e6, max: 1e7 },
      { label: "$10M – $100M", min: 1e7, max: 1e8 },
      { label: "$100M and over", min: 1e8, max: Infinity },
    ];
    const bySize = BANDS.map(b => {
      const inBand = rows.filter(x => (x.amount || 0) >= b.min && (x.amount || 0) < b.max);
      const v = inBand.reduce((a, x) => a + (x.amount || 0), 0);
      return { band: b.label, contracts: inBand.length, value: Math.round(v),
               shareOfValuePct: total > 0 ? Math.round((v / total) * 1000) / 10 : null };
    });

    // CATEGORY: resolve each contract's first code against the seeded titles by longest prefix.
    const codes = Array.from(new Set(rows.flatMap(x => (x.unspscCodes || []).slice(0, 1)).filter(Boolean)));
    let titleByCode = {};
    if (codes.length) {
      const cr = await gateway.kg.query({
        cypher: `MATCH (c:ProcurementCategory) WHERE c.code IN $codes RETURN c.code AS code, c.title AS title`,
        params: JSON.stringify({ codes }),
      });
      ((cr && cr.rows) ? cr.rows : (cr || [])).forEach(x => { titleByCode[x.code] = x.title; });
      warnings.push(...((cr && cr.warnings) || []));
    }
    // Longest-prefix fallback: 8-digit exact, then family (xxxx0000), then segment (xx000000).
    const prefixes = Array.from(new Set(codes.flatMap(c => [c.slice(0, 4) + "0000", c.slice(0, 2) + "000000"])));
    if (prefixes.length) {
      const pr = await gateway.kg.query({
        cypher: `MATCH (c:ProcurementCategory) WHERE c.code IN $codes RETURN c.code AS code, c.title AS title`,
        params: JSON.stringify({ codes: prefixes }),
      });
      ((pr && pr.rows) ? pr.rows : (pr || [])).forEach(x => { titleByCode[x.code] = titleByCode[x.code] || x.title; });
    }
    const resolve = (code) => {
      if (!code) return null;
      return titleByCode[code] ? { title: titleByCode[code], matchedOn: "exact code" }
        : titleByCode[code.slice(0, 4) + "0000"] ? { title: titleByCode[code.slice(0, 4) + "0000"], matchedOn: "code family" }
        : titleByCode[code.slice(0, 2) + "000000"] ? { title: titleByCode[code.slice(0, 2) + "000000"], matchedOn: "code segment" }
        : null;
    };
    // Zero rows back from a non-empty ask means the ProcurementCategory nodes do not exist here —
    // a setup state, not a data state, and reporting it as "1,096 uncategorised" reads as a defect
    // in the register rather than an unseeded world.
    const codesetSeeded = Object.keys(titleByCode).length > 0;
    const catAgg = {}; let uncategorised = { contracts: 0, value: 0, codes: {} };
    for (const x of rows) {
      const code = (x.unspscCodes || [])[0];
      const hit = resolve(code);
      if (!hit) {
        uncategorised.contracts++; uncategorised.value += (x.amount || 0);
        if (code) uncategorised.codes[code] = (uncategorised.codes[code] || 0) + 1;
        continue;
      }
      const k = hit.title;
      catAgg[k] = catAgg[k] || { title: k, matchedOn: hit.matchedOn, contracts: 0, value: 0 };
      catAgg[k].contracts++; catAgg[k].value += (x.amount || 0);
    }
    const byCategory = Object.values(catAgg).map(e => ({
      ...e, value: Math.round(e.value),
      shareOfValuePct: total > 0 ? Math.round((e.value / total) * 1000) / 10 : null,
    })).sort((a, b) => b.value - a.value).slice(0, 20);

    // ---- Judgment: sector classification, only if asked for -------------------------------
    // PER-ROW, and that distinction is the whole bug this replaced: `classify(text, labels)` is a
    // fan-IN aggregation that reduces a GROUP to ONE label, so with no grouping key the entire
    // window collapsed to a single "other". `ai.classify(alias, 'dimension')` is the fan-OUT
    // projection — one label per row — which can then be grouped.
    //
    // The dimension must be a QUOTED LITERAL in the Cypher: the rewriter matches
    // `ai.classify(alias, '...')` textually and a $param never matches it. So the labels are
    // escaped and inlined, and single quotes are stripped rather than escaped into the literal.
    let bySector = null, sectorNote = null;
    if (sectors) {
      const labels = sectors.replace(/['"\\]/g, " ").replace(/\s+/g, " ").trim();
      const dimension = `sector: ${labels.split(",").map(s => s.trim()).filter(Boolean).join(" / ")}`;
      const sr = await gateway.kg.query({
        cypher: `
          MATCH (w:PublicationWindow {window:$window})-[:PUBLISHED]->(r:ContractRelease)
          RETURN ai.classify(r, '${dimension}') AS sector,
                 count(r) AS contracts, sum(toFloat(r.amount)) AS value
        `,
        params: JSON.stringify({ window }),
      });
      const srows = ((sr && sr.rows) ? sr.rows : (sr || []));
      warnings.push(...((sr && sr.warnings) || []));
      bySector = srows
        .map(x => ({
          sector: String(x.sector || "").trim() || "(unlabelled)",
          contracts: Number(x.contracts || 0), value: Math.round(Number(x.value || 0)),
          shareOfValuePct: total > 0 ? Math.round((Number(x.value || 0) / total) * 1000) / 10 : null,
        }))
        .sort((a, b) => b.value - a.value);
      // One label covering everything is the signature of the fan-in mistake, or of a model that
      // could not tell the labels apart. Say so rather than presenting 100% of one bucket as a finding.
      const single = bySector.length === 1;
      sectorNote = "A model read each contract's DESCRIPTION and assigned it one of your labels. " +
        "It is a reading of the agencies' prose, not a government classification, and a different " +
        "label set would produce a different split." +
        (single ? " EVERY contract landed in one label — treat that as a failed classification " +
                  "(too-similar labels, or descriptions too terse to separate), not as a finding." : "");
    } else {
      sectorNote = "Skipped — no sector labels supplied, so no model ran.";
    }

    await gateway.lens.present({ content: JSON.stringify({
      kind: "au-money-by",
      window: { from, to }, sectorLabels: sectors || null,
      status: failed ? "FAILED" : ((truncated || !codesetSeeded) ? "PARTIAL" : "COMPLETE"),
      warnings: codesetSeeded ? warnings
        : warnings.concat(["The UNSPSC codeset is not seeded in this world, so the category cut is empty. Reload the world to seed it."]),
      joins: [
        { source: "AusTender OCDS API", role: "Contract notices published in the window",
          licence: "CC BY 3.0 AU, keyless", ok: !failed, detail: `${rows.length} release(s)` },
        { source: "AusTender UNSPSC codeset (seeded)", role: "Category titles for the codes contracts carry",
          licence: "CC BY", ok: codesetSeeded,
          detail: codesetSeeded
            ? `${Object.keys(titleByCode).length} code(s) resolved`
            : "NOT SEEDED in this world — reload the world to seed the published codeset" },
      ],
      totals: { contracts: rows.length, value: Math.round(total),
                coverage: truncated ? "the fetched releases only" : "the whole window" },
      bySize,
      byCategory,
      uncategorised: { contracts: uncategorised.contracts, value: Math.round(uncategorised.value),
                       exampleCodes: Object.keys(uncategorised.codes).slice(0, 6),
                       note: codesetSeeded
                         ? "Codes absent from the published codeset, or contracts with no code. " +
                           "Reported rather than folded into a category."
                         : "THE CODESET IS NOT SEEDED IN THIS WORLD — every contract is unmatched for that " +
                           "reason, not because its code is unpublished. Reload the world (or POST " +
                           "/api/v1/admin/reference/seed) to seed the 586 published UNSPSC titles." },
      bySector, sectorNote,
      interpretation: {
        factual: ["bySize", "byCategory", "uncategorised", "totals"],
        judged: ["bySector"],
      },
      limits: [
        "Category titles are the government's own for the codes it publishes; a contract's code can be broader than the work, and the match level (exact/family/segment) is stated per row.",
        "Sector labels are a reading of description prose by a model, and are opt-in — a different label set gives a different answer.",
        "Values are commitments as published, not expenditure, and shares are of the fetched window.",
      ],
      source: "AusTender OCDS API (CC BY 3.0 AU) + AusTender UNSPSC codeset (CC BY, seeded)",
    }) });
presentation:
  href: /apps/moneytrail.html

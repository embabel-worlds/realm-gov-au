id: au-threshold-clusters
name: Awards clustered under thresholds
description: >-
  A pattern detector, fenced as one: agency–supplier pairs with several awards in the window
  each sitting just under a procurement threshold, summing over it. Splitting a requirement to
  avoid a threshold is prohibited by the Commonwealth Procurement Rules — but clustered small
  awards are ALSO what routine, legitimate ordering looks like. This lens finds the SHAPE and
  hands it to a human; it never claims intent, and no output of it may be read as a finding.
params:
  - name: from
    type: DATE
    label: Window from
    required: true
    default: "2026-07-01"
  - name: to
    type: DATE
    label: Window to (exclusive)
    required: true
    default: "2026-07-28"
  - name: threshold
    type: STRING
    label: Threshold (AUD) — default $80k, the open-tender threshold for non-construction
    required: false
    default: "80000"
spec:
  kind: cypherscript
  script: |
    const isoAt = (d) => { const v = String(d || '').trim(); return !v ? v : (/T/.test(v) ? v : v + 'T00:00:00Z'); };
    const from = isoAt(lensArgs.from), to = isoAt(lensArgs.to);
    const threshold = Number(lensArgs.threshold || 0) || 80000;
    const nearFloor = threshold * 0.6;  // "just under" = within [60%, 100%) of the threshold
    const window = `${from}/${to}`;
    const asText = (w) => (typeof w === "string" ? w : JSON.stringify(w) || "").toUpperCase();

    const q = await gateway.kg.query({
      cypher: `
        MATCH (w:PublicationWindow {window:$window})-[:PUBLISHED]->(r:ContractRelease)
        WHERE toFloat(r.amount) >= $nearFloor AND toFloat(r.amount) < $threshold
        RETURN r.cnId AS cnId, r.supplierName AS supplierName, r.agencyName AS agencyName,
               toFloat(r.amount) AS amount, r.releaseDate AS releaseDate,
               r.procurementMethod AS procurementMethod, r.description AS description
      `,
      params: JSON.stringify({ window, nearFloor, threshold }),
    });
    const rows = ((q && q.rows) ? q.rows : (q || []));
    const warnings = (q && q.warnings) || [];
    const failed = warnings.some(w => { const t = asText(w);
      return t.includes("PRODUCER_ERROR") || t.includes("FETCH_FAILURE"); });

    const norm = (s) => String(s || "(unstated)").toUpperCase().replace(/[^A-Z0-9]/g, "");
    const pairs = {};
    for (const r of rows) {
      const k = norm(r.agencyName) + "|" + norm(r.supplierName);
      const p = (pairs[k] = pairs[k] || {
        agencyName: r.agencyName, supplierName: r.supplierName, awards: [],
      });
      p.awards.push(r);
    }
    const clusters = Object.values(pairs)
      .filter(p => p.awards.length >= 2 &&
                   p.awards.reduce((n, a) => n + (a.amount || 0), 0) >= threshold)
      .map(p => ({
        agencyName: p.agencyName, supplierName: p.supplierName,
        awards: p.awards.length,
        combinedValue: Math.round(p.awards.reduce((n, a) => n + (a.amount || 0), 0)),
        eachUnderThreshold: true,
        methods: [...new Set(p.awards.map(a => a.procurementMethod || "unstated"))],
        contracts: p.awards.map(a => ({
          cnId: a.cnId, amount: a.amount, releaseDate: String(a.releaseDate || "").slice(0, 10),
          description: String(a.description || "").slice(0, 100),
          austenderUrl: "https://www.tenders.gov.au/Search/KeywordSearch?keyword=" + encodeURIComponent(a.cnId),
        })),
      }))
      .sort((a, b) => b.awards - a.awards || b.combinedValue - a.combinedValue);

    await gateway.lens.present({ content: JSON.stringify({
      kind: "au-threshold-clusters",
      window: { from, to }, threshold, nearFloor: Math.round(nearFloor),
      status: failed ? "FAILED" : (warnings.length ? "PARTIAL" : "COMPLETE"),
      warnings,
      headline: {
        nearThresholdAwards: rows.length,
        clusters: clusters.length,
        note: `${clusters.length} agency–supplier pair(s) took ≥2 awards each in the $${(nearFloor / 1000).toFixed(0)}k–$${(threshold / 1000).toFixed(0)}k band, summing over the threshold — a SHAPE for a human to look at, never a finding.`,
      },
      queries: [{
        title: "Near-threshold awards, paired (arithmetic)",
        cypher: "MATCH (w:PublicationWindow {window:$window})-[:PUBLISHED]->(r:ContractRelease)\nWHERE toFloat(r.amount) >= $nearFloor AND toFloat(r.amount) < $threshold\nRETURN r.agencyName, r.supplierName, count(r), sum(toFloat(r.amount))",
      }],
      clusters: clusters.slice(0, 15),
      interpretation: {
        factual: ["award amounts, dates and methods, verbatim; the band membership and sums"],
        judged: [],
        note: "The CPRs prohibit splitting a procurement to avoid a threshold — AND routine ordering produces exactly this shape legitimately. This lens can only surface the shape; intent is invisible to a register.",
      },
      limits: [
        "One window: recurring monthly orders will appear here every month, and that repetition is usually the innocent explanation.",
        "Name-grouped: a supplier under multiple spellings splits; entity games are invisible.",
        "The default threshold is the CPR open-tender threshold for non-construction; other thresholds exist and matter.",
      ],
      source: "AusTender OCDS API (CC BY 3.0 AU)",
    }) });
presentation:
  href: /apps/pattern-room.html

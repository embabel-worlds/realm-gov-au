id: au-current-members
name: The current House, by division
description: >-
  All 150 current members of the House of Representatives with party and division, from the
  Parliamentary Handbook — the lookup surface the Money Trail app joins to supplier geography.
  Carries the geography rule verbatim: locating a supplier in an electorate says nothing about
  its member.
params: []
spec:
  kind: cypherscript
  script: |
    const r = await gateway.kg.query({
      cypher: `
        MATCH (p:CurrentParliament {key:'house'})-[:HAS_MEMBER]->(m:FederalMember)
        RETURN m.division AS division, m.name AS name, m.party AS party,
               m.partyAbbrev AS partyAbbrev, m.state AS state, m.phid AS phid
        ORDER BY m.division
      `,
      params: JSON.stringify({}),
    });
    const rows = ((r && r.rows) ? r.rows : (r || []));
    const warnings = (r && r.warnings) || [];
    await gateway.lens.present({ content: JSON.stringify({
      kind: "au-current-members",
      status: rows.length ? (warnings.length ? "PARTIAL" : "COMPLETE") : "FAILED",
      warnings,
      joins: [{ source: "Parliamentary Handbook API", role: "Current House members with party and division",
                licence: "aph.gov.au; API terms unverified", ok: rows.length > 0,
                detail: `${rows.length} members` }],
      members: rows.map(m => ({ ...m, partyAbbrev: String(m.partyAbbrev || "").trim() })),
      rule: "Locating a supplier's registered address in an electorate is geography. It says " +
            "nothing about the member — not involvement, not awareness, not benefit.",
      source: "Parliamentary Handbook API (handbookapi.aph.gov.au)",
    }) });
presentation:
  href: /apps/moneytrail.html

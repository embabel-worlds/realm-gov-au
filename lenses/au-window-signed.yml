id: au-window-signed
name: What the Commonwealth signed in a period
description: >-
  Contract notices first published in a date window — total committed value, the procurement-
  method split (with every limited tender's stated reason available), and the largest contracts,
  suppliers and agencies. Pure arithmetic over the register's rows; a capped fetch is reported
  as PARTIAL, never passed off as the whole period.
params:
  - name: from
    type: DATE
    label: From
    required: true
    default: "2026-07-21"
  - name: to
    type: DATE
    label: To (exclusive)
    required: true
    default: "2026-07-28"
  - name: minAmount
    type: STRING
    label: Ignore contracts below (AUD)
    required: false
    default: "0"
spec:
  kind: cypherscript
  script: |
    // The RECORD, not a search for it. awards[0].id is 'CN4250495-<32 hex>' and that hex IS
    // AusTender's own record id, so /Cn/Show/<hyphenated> opens the notice itself; the keyword
    // search only ever landed the reader on a results page they had to re-click. Verified live
    // against both shapes. Falls back to the search when awardId is absent (a cached row from
    // before the projection existed), because a working search beats a broken record link.
    const noticeUrl = (awardId, cnId) => {
      const h = String(awardId || "").split("-")[1] || "";
      if (h.length === 32) {
        const u = `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
        return `https://www.tenders.gov.au/Cn/Show/${u}`;
      }
      return "https://www.tenders.gov.au/Search/KeywordSearch?keyword=" + encodeURIComponent(cnId || "");
    };
    // Params are DATEs (the generated form gives a date picker); the feed wants ISO instants.
    const isoAt = (d, endOfDay) => {
      const v = String(d || '').trim();
      if (!v) return v;
      return /T/.test(v) ? v : v + (endOfDay ? 'T23:59:59Z' : 'T00:00:00Z');
    };
    const from = isoAt(lensArgs.from);
    const to = isoAt(lensArgs.to);
    const minAmount = Number(lensArgs.minAmount || 0) || 0;
    const window = `${from}/${to}`;

    const r = await gateway.kg.query({
      cypher: `
        MATCH (w:PublicationWindow {window:$window})-[:PUBLISHED]->(r:ContractRelease)
        WHERE toFloat(r.amount) >= $minAmount
        RETURN r.cnId AS cnId, r.awardId AS awardId, r.title AS title, r.description AS description,
               toFloat(r.amount) AS amount, r.supplierName AS supplierName,
               r.supplierAbn AS supplierAbn, r.agencyName AS agencyName,
               r.supplierRegion AS supplierRegion,
               r.procurementMethod AS procurementMethod,
               r.limitedTenderReason AS limitedTenderReason,
               r.releaseDate AS releaseDate
        ORDER BY amount DESC
      `,
      params: JSON.stringify({ window, minAmount }),
    });
    const rows = ((r && r.rows) ? r.rows : (r || []));
    const warnings = (r && r.warnings) || [];
    const asText = (w) => (typeof w === "string" ? w : JSON.stringify(w) || "").toUpperCase();
    const failed = warnings.some(w => { const t = asText(w);
      return t.includes("PRODUCER_ERROR") || t.includes("FETCH_FAILURE") ||
             t.includes("COULD NOT BE FETCHED") || t.includes("AUTH_EXPIRED"); });
    // The walker caps at 12 pages (1,200 releases) and says so — a windowed aggregate over a
    // capped fetch is a SAMPLE. The truncation warning decides the status; totals over a sample
    // are labelled as covering "the fetched releases", never "the period".
    const truncated = warnings.some(w => asText(w).includes("MORE") || asText(w).includes("CAP"));

    const sum = rows.reduce((a, x) => a + (x.amount || 0), 0);
    const byMethod = {};
    for (const x of rows) {
      const m = x.procurementMethod || "unstated";
      byMethod[m] = byMethod[m] || { count: 0, value: 0 };
      byMethod[m].count++; byMethod[m].value += (x.amount || 0);
    }
    // Grouping key strips case and punctuation: the register publishes the same supplier under
    // varying spellings ("DATA #3 LIMITED" vs "Data#3 Limited"), and a top-suppliers ranking
    // that splits an entity by casing is exactly the error this product exists to avoid. The
    // DISPLAYED name is the variant carrying the most value; raw rows keep names as published.
    const groupTop = (field, n) => {
      const g = {};
      for (const x of rows) {
        const raw = x[field] || "(unstated)";
        const k = raw.toUpperCase().replace(/[^A-Z0-9]/g, "") || raw;
        g[k] = g[k] || { name: raw, count: 0, value: 0, topVariantValue: -1, variants: new Set() };
        g[k].count++; g[k].value += (x.amount || 0); g[k].variants.add(raw);
        if ((x.amount || 0) > g[k].topVariantValue) { g[k].topVariantValue = x.amount || 0; g[k].name = raw; }
      }
      return Object.values(g).sort((a, b) => b.value - a.value).slice(0, n)
        .map(v => ({ name: v.name, count: v.count, value: v.value,
                     spellingsGrouped: v.variants.size > 1 ? Array.from(v.variants) : undefined }));
    };

    await gateway.lens.present({ content: JSON.stringify({
      kind: "au-window-signed",
      window: { from, to }, minAmount,
      status: failed ? "FAILED" : (truncated ? "PARTIAL" : "COMPLETE"),
      warnings,
      queries: [{
        title: "Contracts first published in the window",
        note: "Aggregates are arithmetic over the register's rows; no model produces any figure.",
        cypher: "MATCH (w:PublicationWindow {window:$window})-[:PUBLISHED]->(r:ContractRelease)\n" +
                "WHERE toFloat(r.amount) >= $minAmount RETURN r ORDER BY toFloat(r.amount) DESC",
      }],
      joins: [{ source: "AusTender OCDS API", role: "Contract notices first published in the window",
                licence: "CC BY 3.0 AU, keyless", ok: !failed,
                detail: `${rows.length} release(s) fetched${truncated ? " (CAPPED — sample, not the period)" : ""}` }],
      totals: {
        fetchedCount: rows.length,
        fetchedValue: Math.round(sum),
        coverage: truncated
          ? "the fetched releases only — the window has more; narrow it or split it"
          : "the whole window",
      },
      byMethod,
      topContracts: rows.slice(0, 15).map(x => ({
        cnId: x.cnId, amount: x.amount, supplierName: x.supplierName,
        agencyName: x.agencyName, procurementMethod: x.procurementMethod,
        limitedTenderReason: x.limitedTenderReason || null, description: x.description,
        austenderUrl: noticeUrl(x.awardId, x.cnId),
      })),
      topSuppliers: groupTop("supplierName", 10),
      topAgencies: groupTop("agencyName", 10),
      method: "Contract notices FIRST PUBLISHED in the window (amendments to older contracts are " +
              "not in this feed — ask the change window for those). Values are commitments as " +
              "published, summed arithmetically.",
      limits: [
        "The source filters by nothing but the window itself — supplier/agency cuts are computed after the fetch.",
        "A capped fetch is a sample and is labelled PARTIAL — totals then cover the fetched releases, not the period.",
        "Notices under $10,000 are not required to be published and are absent by design.",
        "Top-supplier/agency rows are grouped case-insensitively across the register's spelling variants; each grouped row lists the spellings it merged.",
      ],
      source: "AusTender OCDS API (CC BY 3.0 AU)",
    }) });
presentation:
  href: /apps/gov-au/moneytrail.html

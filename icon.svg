<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Australian Government registers realm — the Commonwealth Star above a ledger">
  <!--
    The Commonwealth Star over a ledger: Australian public records.

    NOT the Commonwealth Coat of Arms, deliberately. That emblem is reserved to
    Australian Government entities and its use elsewhere needs written permission
    from the Department of the Prime Minister and Cabinet — and this realm is a
    third party READING the Commonwealth's open registers (AusTender, the
    Register of Lobbyists), not an arm of it. An armorial tile would claim an
    endorsement that does not exist, which is the same misrepresentation this
    realm's own prose is careful to avoid.

    The seven-pointed Commonwealth Star carries none of that restriction: it is
    the star of the national flag, one point for each of the six states and one
    for the territories. With the national green and gold it reads Australian at
    a glance and claims nothing.

    The three bars beneath are the register — the record the star sits on, and
    the element shared with the UK realm's tile so the pair reads as a family.
    Unequal lengths, because three equal bars read as a hamburger menu.
  -->
  <rect width="64" height="64" rx="14" fill="#0a5c3c"/>

  <!-- Commonwealth Star. Seven points, computed rather than eyeballed. -->
  <path d="M32.00 10.00 L35.21 19.33 L44.51 16.02 L39.21 24.35 L47.60 29.56 L37.79 30.61 L38.94 40.42 L32.00 33.40 L25.06 40.42 L26.21 30.61 L16.40 29.56 L24.79 24.35 L19.49 16.02 L28.79 19.33 Z"
        fill="#ffcd00"/>

  <!-- The register. -->
  <g fill="#f3ead4">
    <rect x="16" y="45.5" width="32" height="3.2" rx="1.6"/>
    <rect x="16" y="51" width="24" height="3.2" rx="1.6" opacity=".78"/>
    <rect x="16" y="56.5" width="14" height="3.2" rx="1.6" opacity=".55"/>
  </g>
</svg>

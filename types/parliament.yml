# The House of Representatives, from the Parliamentary Handbook API — the third register this
# realm joins, closing the chain contract → supplier postcode → electoral division → member.
#
# THE RULE THIS TYPE EXISTS TO ENFORCE, stated once here and repeated on every surface that
# renders the join: locating a supplier's registered address in an electorate is GEOGRAPHY.
# It says NOTHING about the member — not involvement, not awareness, not benefit. The join
# answers "whose electorate are the Commonwealth's suppliers registered in", which is a fair
# public question about where public money lands; it never answers anything about a person.
# Additionally, the postcode→division correspondence is centroid-based (see
# reference/postcode-division.json): a postcode straddling a boundary is assigned approximately,
# and surfaces must say so.

- name: FederalMember
  visibility: internal
  description: >-
    A current member of the House of Representatives — name, party and division, from the
    Parliamentary Handbook. Fetched as one 150-row snapshot by anchoring the current parliament.
    Facts are the Handbook's own; party and electorate are as recorded there today, not at any
    contract's date. Joining a member to contract data by geography carries the rule above.
  properties:
    phid:
      metadata: { identity: "true" }
    name: "Display name as the Handbook records it."
    party: "Full party name, as recorded today."
    partyAbbrev: "Party abbreviation (trimmed)."
    division: "The electoral division represented — the join key to AEC geography."
    state: "State/territory abbreviation."
  virtualJoins:
    - anchorLabel: CurrentParliament
      relationship: HAS_MEMBER
      keyField: key
      recordKeyField: parliamentKey
      producer: currentMembers
      description: >-
        All 150 current House members, keyed by the literal anchor
        (:CurrentParliament {key:'house'}). WHERE m.division IN [...] joins divisions derived
        from supplier postcodes; aggregate by party only with the geography rule attached.

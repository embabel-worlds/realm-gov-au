# Parliamentary mentions — DIRECT ParlInfo search results (Hansard debates, committee evidence,
# Senate Estimates transcripts). Like press coverage (types/coverage.yml) this is NOT a register
# record and is fenced the same way — but the source is now ParlInfo itself, which changes what a
# silence means:
#
#   - A match is a page of the parliamentary record where the searched phrase appears. A real
#     accountability artefact — but the phrase appearing does not make the page ABOUT any
#     contract; a large supplier is discussed in Parliament for many reasons.
#   - A silence is qualified per RECORD CLASS: nothing matched THIS phrase in THAT dataset
#     (chamber Hansard / committees / Estimates). Questions on Notice are NOT yet a searchable
#     dataset here (docs/PARLIAMENT.md), so "never raised in Parliament" still cannot be
#     concluded — only "not found in these records".

- name: ParliamentMention
  visibility: internal
  description: >-
    A page of the parliamentary record matching a search phrase, from ParlInfo's own search:
    chamber Hansard, committee evidence, or a Senate Estimates transcript depending on the edge's
    `via`. NOT a procurement record and NOT evidence about any contract: a page where the searched
    terms appear, carrying its own link and date so a reader can judge it. Questions on Notice
    sometimes cite contract notice ids verbatim, which makes a CN-id phrase the sharpest search
    this type supports.
  properties:
    url:
      metadata: { identity: "true" }
    title: "The record's title as ParlInfo reports it (committee, date, and subject line)."
    summary: "ParlInfo's snippet where present. Render as text; never summarise it into a claim about a contract."
    publishedAt: "The record's date, ISO-normalized where it parses; the feed's raw string where it does not."
    content: >-
      Phrase-anchored EXCERPTS of the followed transcript page (Estimates classes only) — the
      actual exchanges, verbatim, with ParlInfo's speaker attribution intact. Bounded windows,
      never the whole page; absent when the page never mentions the phrase, and absent-with-a-
      warning when the page could not be read (UNKNOWN, not 'no mention').
    searchPhrase: "The phrase this result answered — stamped from the anchor, the honest scope of the match."
  virtualJoins:
    # One anchor, one relationship, four record classes — the query's `via` picks the dataset:
    #   MATCH (q:ParliamentQuery {phrase:'…'})-[:MENTIONED_IN {via:'estimates'}]->(m:ParliamentMention)
    # Lenses ALWAYS pin via, so which part of the record was searched is visible in the query.
    - anchorLabel: ParliamentQuery
      relationship: MENTIONED_IN
      via: chamber
      keyField: phrase
      recordKeyField: searchPhrase
      producer: hansardChamberMentions
      description: "House and Senate Hansard debates matching the pinned phrase (ParlInfo, keyless)."
    - anchorLabel: ParliamentQuery
      relationship: MENTIONED_IN
      via: committees
      keyField: phrase
      recordKeyField: searchPhrase
      producer: committeeMentions
      description: "Senate and joint committee evidence matching the pinned phrase (ParlInfo, keyless)."
    - anchorLabel: ParliamentQuery
      relationship: MENTIONED_IN
      via: estimates
      keyField: phrase
      recordKeyField: searchPhrase
      producer: estimatesMentions
      description: "Senate Estimates transcripts matching the pinned phrase (ParlInfo, keyless) — the accountability venue for procurement."
    - anchorLabel: ParliamentQuery
      relationship: MENTIONED_IN
      via: estimates-period
      keyField: phrase
      recordKeyField: searchPhrase
      producer: estimatesMentionsInPeriod
      description: >-
        Senate Estimates transcripts matching the pinned phrase WITHIN A DATE RANGE — the anchor
        phrase is composite: 'phrase|fromIso|toIso'. The temporal join: was this party before
        Estimates during the contract period?

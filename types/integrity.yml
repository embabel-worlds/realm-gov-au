# The integrity join surface: one anchor (IntegrityQuery, keyed by ABN digits) reaching three
# registers by DISTINCT relationships — so a query names which register it read, and a silence
# is qualified per register. The discipline of every adverse source in this realm:
#
#   1. A record here is a REGISTER ENTRY, never a finding about a contract or a determination
#      about an entity — matching is by ABN, and an ABN can be re-used, transferred, or shared
#      across a corporate group.
#   2. A MISS is qualified: "not in this register" — never "clean". No federal debarment
#      register exists; these are the closest published substitutes.
#   3. Where the register carries DATES (NDIS), the temporal overlap with a contract's own
#      dates is the sharpest honest claim available — and it is still about the REGISTER.

- name: IntegrityQuery
  visibility: internal
  description: >-
    An ABN pinned for integrity screening — the anchor from which the adverse and disclosure
    registers are fetched. The key is digits-normalized, because the same ABN is published
    spaced, unspaced, numeric and float across the source estate.
  properties:
    abn:
      metadata: { identity: "true" }

- name: AdverseRecord
  visibility: internal
  description: >-
    One NDIS Commission compliance action — a banning order, revocation, suspension, refusal or
    compliance notice — matched by ABN. Australia's closest thing to a debarment register entry,
    WITH effective dates, so 'in force during the contract' is a checkable claim. A register
    entry about a provider, never a finding about any contract.
  properties:
    recordKey:
      metadata: { identity: "true" }
    abn: "The matched ABN (digits-normalized), stamped from the anchor."
    register: "The action type as the Commission publishes it (banning order, revocation, …)."
    name: "The provider name as published."
    dateFrom: "Date effective from, as published."
    dateTo: "Date no longer in force; empty = still in force at the snapshot."
    state: "State, as published."
    detail: "The Commission's own 'Relevant information' narrative, verbatim."
  virtualJoins:
    - anchorLabel: IntegrityQuery
      relationship: HAS_ADVERSE
      keyField: abn
      recordKeyField: abn
      producer: ndisActionsByAbn
      # maxAnchors is a COST statement, not a safety ritual: this is a `tabular` producer, so a
      # batch of keys is served by ONE locally cached file scan — 968 ABNs cost the same scan as
      # 20. The 200 default is an API-storm guard for per-anchor REMOTE producers, and leaving it
      # here is what forced cohort-wide screens into JavaScript batching loops instead of views.
      maxAnchors: 3000
      description: "NDIS Commission compliance actions for a pinned ABN (snapshot dataset; the lens shows the snapshot date)."

- name: SlaveryStatement
  visibility: internal
  description: >-
    A Modern Slavery Register lodgement matched by ABN. PRESENCE is a lodgement (the Act's
    baseline duty for entities over the revenue threshold); the interesting signal is usually
    the NEGATIVE join — a threshold-scale entity with nothing lodged. Joint statements pack
    several ABNs into one cell, which this match cannot split — a joint-statement member may
    read as unlodged, and every consuming surface says so.
  properties:
    link:
      metadata: { identity: "true" }
    abn: "The matched ABN (digits-normalized), stamped from the anchor."
    periodStart: "Reporting period start, as lodged."
    periodEnd: "Reporting period end, as lodged."
    kind: "Statement type (normal/joint), as published."
    entities: "The reporting entities named on the statement."
  virtualJoins:
    - anchorLabel: IntegrityQuery
      relationship: HAS_STATEMENT
      keyField: abn
      recordKeyField: abn
      producer: slaveryStatementsByAbn
      # maxAnchors is a COST statement, not a safety ritual: this is a `tabular` producer, so a
      # batch of keys is served by ONE locally cached file scan — 968 ABNs cost the same scan as
      # 20. The 200 default is an API-storm guard for per-anchor REMOTE producers, and leaving it
      # here is what forced cohort-wide screens into JavaScript batching loops instead of views.
      maxAnchors: 3000
      description: "Modern Slavery Register lodgements for a pinned ABN."

- name: TaxRecord
  visibility: internal
  description: >-
    The entity's row in the ATO corporate tax transparency report (total income ≥ $100M),
    matched by ABN. TWO published caveats every consumer carries verbatim: a BLANK taxable
    income or tax payable means '≤ 0' BY LEGISLATION (amounts of zero or less may not be
    reported), never 'unknown'; and the report is entity-level, not consolidated groups — the
    contracting entity often differs from the reporting entity.
  properties:
    abn:
      metadata: { identity: "true" }
    name: "The entity name as the ATO reports it."
    totalIncome: "Total income $, as reported."
    taxableIncome: "Taxable income $; BLANK = ≤ 0 by legislation."
    taxPayable: "Tax payable $; BLANK = ≤ 0 by legislation."
    incomeYear: "The income year of this report row."
  virtualJoins:
    - anchorLabel: IntegrityQuery
      relationship: HAS_TAX_RECORD
      keyField: abn
      recordKeyField: abn
      producer: taxRecordByAbn
      # maxAnchors is a COST statement, not a safety ritual: this is a `tabular` producer, so a
      # batch of keys is served by ONE locally cached file scan — 968 ABNs cost the same scan as
      # 20. The 200 default is an API-storm guard for per-anchor REMOTE producers, and leaving it
      # here is what forced cohort-wide screens into JavaScript batching loops instead of views.
      maxAnchors: 3000
      description: "The ATO tax transparency row for a pinned ABN (2023-24 report; absence usually means income under the $100M threshold)."

# ── The register as a TIME SERIES: catalogue search + whole snapshots (docs/adr/0001) ──────────

- name: CatalogueSearch
  visibility: internal
  description: >-
    A data.gov.au catalogue query pinned as an anchor — a quoted dataset-title phrase. Exists
    because dated-extract series (one dataset per date) can only be enumerated by asking the
    catalogue, and because "does this source exist" deserves a live answer, not a recollection.
  properties:
    query:
      metadata: { identity: "true" }

- name: CatalogueDataset
  visibility: internal
  description: >-
    One dataset matching a pinned catalogue query, with its first resource (the downloadable
    file) inline. For a dated-extract series the title carries the extract date. The composite
    'datasetId|resourceId|<filename from resourceUrl>' is the key an NdisSnapshot anchor takes.
  properties:
    datasetId:
      metadata: { identity: "true" }
    query: "The pinned catalogue query, stamped from the anchor."
    title: "Dataset title as catalogued — a dated extract stamps its date here."
    publisher: "The publishing organisation as catalogued."
    licenseId: "The dataset's own licence id — read, never assumed."
    metadataModified: "ISO timestamp of the last catalogue-metadata change."
    resourceId: "First resource's UUID."
    resourceUrl: "First resource's download URL."
    resourceFormat: "First resource's format as catalogued."
    resourceBytes: "First resource's size in bytes, when the catalogue knows it."
  virtualJoins:
    - anchorLabel: CatalogueSearch
      relationship: HAS_DATASET
      keyField: query
      recordKeyField: query
      producer: datasetCatalogue
      description: "Datasets matching a pinned catalogue phrase: `MATCH (s:CatalogueSearch {query:'…'})-[:HAS_DATASET]->(d:CatalogueDataset)`."

- name: NdisSnapshot
  visibility: internal
  description: >-
    One dated extract of the NDIS Commission compliance register, pinned whole. The key is
    'datasetId|resourceId|filename' as a CatalogueDataset row supplies it. Each extract is
    CURRENT STATE at its date — the series, not any one extract, is where appearance and
    disappearance live.
  properties:
    snapshotKey:
      metadata: { identity: "true" }

- name: SnapshotAction
  visibility: internal
  description: >-
    One row of one dated compliance-register extract, verbatim. The same real-world action
    appears as a row in EVERY extract that carries it, so identity across extracts is a
    consumer-side construction (action type + ABN-or-name + day-normalized effective date) and
    the caveats live with the consumer. Date formats differ ACROSS extracts (dd/mm/yyyy hh:mm
    early 2026, ISO later) — compare days, never raw strings.
  properties:
    rowKey:
      metadata: { identity: "true" }
    snapshotKey: "The pinned extract, stamped from the anchor."
    register: "The action type as the Commission publishes it."
    name: "The provider name as published in THIS extract (name forms drift between extracts)."
    abn: "ABN as published — blank on ~18% of rows; consumers must digits-normalize."
    city: "City as published."
    state: "State as published."
    postcode: "Postcode as published."
    dateFrom: "Date effective from, verbatim in the extract's own format."
    dateTo: "Date no longer in force, verbatim; empty = in force at the extract date."
    detail: "The Commission's own 'Relevant information' narrative, verbatim."
  virtualJoins:
    - anchorLabel: NdisSnapshot
      relationship: HAS_ACTION
      keyField: snapshotKey
      recordKeyField: snapshotKey
      producer: ndisActionsSnapshotRows
      description: "Every row of a pinned extract: `MATCH (s:NdisSnapshot {snapshotKey:'…'})-[:HAS_ACTION]->(a:SnapshotAction)`."

# ── The charity layer: the only open Australian source that puts an ADDRESS against an ABN ─────

# ── The ACNC register row, and the three ways in ─────────────────────────────────────────────────
# One register entry is reachable by ABN, by postcode, and off the disability roll. The row is the
# same row each time; only the access path differs. `CharityRegisterRow` holds what the register
# publishes about a charity, and each reachable type adds its own key, its anchor echo, and whatever
# that particular extract carries. `MATCH (c:CharityRegisterRow)` then answers a question about
# charities without it having to know which path found them.
#
# A CAUTION for the query author: the three paths key differently (abn, charityKey, rollKey), so the
# same charity CAN appear once per path in a query that walks more than one. Aggregate on `abn`, or
# DISTINCT on it, when you span them.
- name: CharityRegisterRow
  visibility: internal
  description: >-
    One entity on the ACNC Register of Australian Charities, however it was reached. A register
    entry about a charity, never a finding about it. `responsiblePersons`, where an extract carries
    it, is a COUNT: no open Australian source publishes officer NAMES in bulk, so a shared-director
    graph cannot be built and no lens may imply one.
  properties:
    abn: "The charity's ABN — the join back to money."
    charityName: "Registered legal name."
    otherNames: "Other/trading names as registered — the name a grant may be published under."
    town: "Town or city."
    state: "State."
    postcode: "Postcode."
    registrationDate: "Date registered with the ACNC."
    established: "Date the organisation itself was established — earlier than registration."
    charitySize: "ACNC size band (small/medium/large), which is a REVENUE band, not a headcount."

- name: CharityRecord
  parents: [CharityRegisterRow]
  visibility: internal
  description: >-
    The register entry matched BY ABN. The richest of the three paths: it carries the full
    registered street address — the join that makes co-located providers visible — plus the
    website and the disability-beneficiary flag, on top of what every register row carries.
  properties:
    abn:
      metadata: { identity: "true" }
    addressLine1: "Registered address, line 1 — verbatim, unnormalized."
    addressLine2: "Registered address, line 2."
    website: "Charity website as registered."
    responsiblePersons: "COUNT of responsible persons. Never names — they are not published in bulk."
    servesPeopleWithDisabilities: "The register's own beneficiary flag for people with disabilities."
  virtualJoins:
    - anchorLabel: IntegrityQuery
      relationship: HAS_CHARITY_RECORD
      keyField: abn
      recordKeyField: abn
      producer: charityByAbn
      # maxAnchors is a COST statement, not a safety ritual: this is a `tabular` producer, so a
      # batch of keys is served by ONE locally cached file scan — 968 ABNs cost the same scan as
      # 20. The 200 default is an API-storm guard for per-anchor REMOTE producers, and leaving it
      # here is what forced cohort-wide screens into JavaScript batching loops instead of views.
      maxAnchors: 3000
      description: "The charity register entry for a pinned ABN: `MATCH (q:IntegrityQuery {abn:'…'})-[:HAS_CHARITY_RECORD]->(c:CharityRecord)`."

- name: DisabilityServiceRoll
  visibility: internal
  description: >-
    The ACNC register's People_with_Disabilities beneficiary flag pinned as an anchor (the only
    published value is 'Y') — one anchor enumerates every charity the ACNC classified as serving
    people with disabilities. The candidate roll for the provider ledger. The flag is a
    registration-time classification: absence means unclassified, never 'not a disability
    provider', and unregistered (non-charity) providers are invisible here entirely.
  properties:
    marker:
      metadata: { identity: "true" }

- name: DisabilityCharity
  parents: [CharityRegisterRow]
  visibility: internal
  description: >-
    The register entry reached off the ACNC's disability-serving roll — the whole cohort in one
    walk, rather than one ABN at a time. Carries the register row and nothing more: this extract
    publishes no street address, no website and no responsible-person count.
  properties:
    rollKey:
      metadata: { identity: "true" }
    marker: "The pinned flag, stamped from the anchor."
  virtualJoins:
    - anchorLabel: DisabilityServiceRoll
      relationship: HAS_CHARITY
      keyField: marker
      recordKeyField: marker
      producer: charitiesServingDisabilities
      description: "The whole disability-serving slice of the charity register: `MATCH (r:DisabilityServiceRoll {marker:'Y'})-[:HAS_CHARITY]->(c:DisabilityCharity)`."

# ── The Annual Information Statement, and the two years the realm fetches ─────────────────────────
# FY24 and FY23 are the same filing shape a year apart. `AnnualInformationStatement` declares the
# shape once so a trajectory question — revenue, FTE, expenses over time — can read one label and
# ORDER BY the reporting period, instead of naming two types and pairing their variables by hand.
# Each year keeps its own key and whatever detail its extract carries.
- name: AnnualInformationStatement
  visibility: internal
  description: >-
    One Annual Information Statement row as filed with the ACNC, for whichever year was fetched.
    Everything here is SELF-reported and lagged; small charities file reduced detail; a
    consolidated report ('y') covers a GROUP and makes per-entity arithmetic meaningless; and NDIS
    fee-for-service may sit under goods-and-services rather than government revenue — which line a
    provider uses is itself informative. Comparing two years compares two SELF-REPORTS, and a
    changed reporting period or a group-structure change moves figures without anything happening
    in the world.
  properties:
    abn: "The matched ABN, stamped from the anchor."
    charityName: "Name as filed."
    charitySize: "ACNC size band for the year."
    reportingPeriodTo: "Financial report period end, as filed — compare money to THIS period, not to a calendar year, and compare like with like across years."
    consolidated: "'y' when the report consolidates more than one entity — group figures, not this entity's."
    fteTotal: "Total full-time-equivalent staff, as filed — the denominator of revenue per FTE."
    employeeExpenses: "Employee expenses $, as filed — the cross-check that separates 'few staff' from 'mis-keyed FTE'."
    revenueGovernment: "Revenue from government $, as filed — self-reported, all levels of government."
    revenueGoodsServices: "Revenue from goods and services $, as filed — where NDIS fee-for-service often books."
    revenueTotal: "Total revenue $, as filed."
    otherExpenses: "All other expenses $ — everything that is not employee expenses, interest or grants made."
    expensesTotal: "Total expenses $, as filed."
    relatedPartyTransactions: "'y'/'n' — the charity's own declaration of reportable related-party transactions."

- name: AisReturn
  parents: [AnnualInformationStatement]
  visibility: internal
  description: >-
    The charity's FY2024 Annual Information Statement row — its OWN filing to the ACNC: revenue
    from government, goods-and-services revenue, staff headcounts and total FTE, employee
    expenses, grants it made to others, and the self-declared related-party flag. The
    reconstructed ledger of docs/adr/0001. Everything here is SELF-reported and lagged; small
    charities file reduced detail; a consolidated report ('y') covers a GROUP and makes
    per-entity arithmetic meaningless; and NDIS fee-for-service may sit under goods-and-services
    rather than government revenue — which line a provider uses is itself informative.
  properties:
    aisKey:
      metadata: { identity: "true" }
    registrationStatus: >-
      ACNC registration status carried by the published AIS dataset, including Registered and
      the specific revocation category. A voluntary revocation often means the charity ceased,
      merged or chose to continue outside ACNC registration; it is context for a historical
      filing anomaly, not evidence of misconduct.
    reportingPeriodFrom: "Financial report period start, as filed."
    statementType: "Type of financial statement filed."
    purposesPursued: >-
      FREE TEXT: how the charity says it pursued its purposes that year, in its own words. The only
      narrative field in the AIS, and the only place a provider describes what it actually did —
      clusterable, and the counterpart to the money columns beside it.
    staffFullTime: "Full-time staff headcount, as filed."
    staffPartTime: "Part-time staff headcount, as filed."
    staffCasual: "Casual staff headcount, as filed."
    staffVolunteers: "Volunteers, as filed."
    donationsBequests: "Donations and bequests $, as filed."
    grossIncomeTotal: "Total gross income $, as filed."
    grantsMadeAustralia: "Grants and donations the charity made for use in Australia $ — high pass-through explains revenue without staff."
    grantsMadeOverseas: "Grants and donations made for use outside Australia $."
    otherExpenses: "All other expenses $ — everything that is not employee expenses, interest or grants made. For a provider that BROKERS services rather than employing staff, this is where the money leaves; its recipients are named nowhere public."
    netSurplus: "Net surplus/deficit $, as filed."
  virtualJoins:
    - anchorLabel: IntegrityQuery
      relationship: HAS_AIS
      keyField: abn
      recordKeyField: abn
      producer: aisReturnByAbn
      # maxAnchors is a COST statement, not a safety ritual: this is a `tabular` producer, so a
      # batch of keys is served by ONE locally cached file scan — 968 ABNs cost the same scan as
      # 20. The 200 default is an API-storm guard for per-anchor REMOTE producers, and leaving it
      # here is what forced cohort-wide screens into JavaScript batching loops instead of views.
      maxAnchors: 3000
      description: "The FY24 AIS row for a pinned ABN: `MATCH (q:IntegrityQuery {abn:'…'})-[:HAS_AIS]->(a:AisReturn)`."

# ── A charity's declared programs, and the three ways in ─────────────────────────────────────────
# The same AIS program row is reachable by the charity's ABN, by FY24 classification, and by FY23
# classification. `CharityProgramRow` is that row; each type below adds its key and its anchor echo.
- name: CharityProgramRow
  visibility: internal
  description: >-
    One program a charity declared in an Annual Information Statement — its name, the ACNC
    classification the charity chose for it, and the entity that filed it. The MIX of programs is
    what tells a reader whether a flagged figure is even NDIS money: the AIS reports a single
    government-revenue line covering aged care, disability, homelessness and everything else the
    charity does.
  properties:
    abn: "The reporting charity's ABN."
    charityName: "The reporting charity's name as filed."
    programName: "The program name as the charity filed it."
    classification: "The ACNC classification the charity chose for the program."

- name: DeclaredProgram
  parents: [CharityProgramRow]
  visibility: internal
  description: >-
    One program a charity declared in its FY24 AIS, fetched BY ABN — the whole mix for one
    entity. The mix is what tells a reader whether a flagged figure is even NDIS money: the AIS
    reports a single government-revenue line covering aged care, disability, homelessness and
    everything else the charity does.
  properties:
    programKey:
      metadata: { identity: "true" }
  virtualJoins:
    - anchorLabel: IntegrityQuery
      relationship: HAS_DECLARED_PROGRAM
      keyField: abn
      recordKeyField: abn
      producer: programsByAbn
      # maxAnchors is a COST statement, not a safety ritual: this is a `tabular` producer, so a
      # batch of keys is served by ONE locally cached file scan — 968 ABNs cost the same scan as
      # 20. The 200 default is an API-storm guard for per-anchor REMOTE producers, and leaving it
      # here is what forced cohort-wide screens into JavaScript batching loops instead of views.
      maxAnchors: 3000
      description: "Every FY24 program a pinned ABN declared: `MATCH (q:IntegrityQuery {abn:'…'})-[:HAS_DECLARED_PROGRAM]->(p:DeclaredProgram)`."

- name: PriorProgramClass
  visibility: internal
  description: >-
    The same ACNC program classification, pinned against the FY2023 programs file. Exists so a
    disappearance is answerable: an entity that declared a disability program in FY23 and none in
    FY24 either stopped filing, stopped doing disability work, or reclassified — the register does
    not say which, and non-filing is frequently administrative (extensions are routine).
  properties:
    classification:
      metadata: { identity: "true" }

- name: PriorCharityProgram
  parents: [CharityProgramRow]
  visibility: internal
  description: >-
    One program a charity reported in its FY23 AIS, under a pinned classification.
  properties:
    programKey:
      metadata: { identity: "true" }
    classification: "The pinned classification, stamped from the anchor."
  virtualJoins:
    - anchorLabel: PriorProgramClass
      relationship: HAS_PROGRAM
      keyField: classification
      recordKeyField: classification
      producer: priorProgramsByClassification
      description: "Every FY23 program under a pinned classification: `MATCH (p:PriorProgramClass {classification:'Disability services'})-[:HAS_PROGRAM]->(g:PriorCharityProgram)`."

- name: AisPriorReturn
  parents: [AnnualInformationStatement]
  visibility: internal
  description: >-
    The same charity's FY2023 Annual Information Statement row — the prior point that makes a
    TRAJECTORY visible (a billing surge, a staff collapse, a first-ever filing). Same
    self-reported, lagged caveats as AisReturn; comparing two years compares two SELF-REPORTS,
    and a changed reporting period or a group-structure change moves figures without anything
    happening in the world.
  properties:
    aisPriorKey:
      metadata: { identity: "true" }
    otherExpenses: "All other expenses $, FY23 — the prior point that makes a workforce-model change visible."
  virtualJoins:
    - anchorLabel: IntegrityQuery
      relationship: HAS_AIS_PRIOR
      keyField: abn
      recordKeyField: abn
      producer: aisPriorReturnByAbn
      # maxAnchors is a COST statement, not a safety ritual: this is a `tabular` producer, so a
      # batch of keys is served by ONE locally cached file scan — 968 ABNs cost the same scan as
      # 20. The 200 default is an API-storm guard for per-anchor REMOTE producers, and leaving it
      # here is what forced cohort-wide screens into JavaScript batching loops instead of views.
      maxAnchors: 3000
      description: "The FY23 AIS row for a pinned ABN: `MATCH (q:IntegrityQuery {abn:'…'})-[:HAS_AIS_PRIOR]->(a:AisPriorReturn)`."

- name: ProgramClass
  visibility: internal
  description: >-
    An ACNC program classification pinned as an anchor — the register's own taxonomy of what a
    charity's programs DO ('Disability services', 'Housing for people with disabilities', …).
    The classification is the charity's own selection at filing time, which is exactly its
    value: it is the self-declared answer to "is this entity in the disability business",
    sharper than the beneficiary flag a hospital or university also carries.
  properties:
    classification:
      metadata: { identity: "true" }

- name: CharityProgram
  parents: [CharityProgramRow]
  visibility: internal
  description: >-
    One program a charity reported in its FY24 AIS, under a pinned classification. The program
    name is the charity's own wording.
  properties:
    programKey:
      metadata: { identity: "true" }
    classification: "The pinned classification, stamped from the anchor."
    registrationStatus: >-
      The ACNC registration status carried on the FY24 program row, including the exact voluntary
      revocation category. It describes the charity-registration position, not NDIS registration.
  virtualJoins:
    - anchorLabel: ProgramClass
      relationship: HAS_PROGRAM
      keyField: classification
      recordKeyField: classification
      producer: programsByClassification
      description: "Every FY24 program filed under a pinned classification: `MATCH (p:ProgramClass {classification:'Disability services'})-[:HAS_PROGRAM]->(g:CharityProgram)`."

- name: PostcodeArea
  visibility: internal
  description: >-
    A postcode pinned in order to ask which registered charities share it — the anchor behind
    co-location clustering. Postcode is the anchor rather than the street address because an
    address is written many ways and only a consumer can normalize it.
  properties:
    postcode:
      metadata: { identity: "true" }

- name: CharityAtPostcode
  parents: [CharityRegisterRow]
  visibility: internal
  description: >-
    One charity registered in a pinned postcode, with its verbatim address so a consumer can
    normalize and cluster. Co-location is a fact about two REGISTERED ADDRESSES and nothing more:
    shared premises are routine and lawful (a serviced office, a community hub, a shared
    auspicing arrangement), so a cluster is a place to look, never a finding.
  properties:
    charityKey:
      metadata: { identity: "true" }
    postcode: "The pinned postcode, stamped from the anchor."
    addressLine1: "Registered address, line 1 — verbatim, unnormalized."
    addressLine2: "Registered address, line 2."
    responsiblePersons: "COUNT of responsible persons; never names."
    servesPeopleWithDisabilities: "The register's own disability-beneficiary flag."
  virtualJoins:
    - anchorLabel: PostcodeArea
      relationship: HAS_CHARITY
      keyField: postcode
      recordKeyField: postcode
      producer: charitiesByPostcode
      description: "Every registered charity in a pinned postcode: `MATCH (p:PostcodeArea {postcode:'2830'})-[:HAS_CHARITY]->(c:CharityAtPostcode)`."

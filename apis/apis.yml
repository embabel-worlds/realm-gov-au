# Two sources. Both Commonwealth government, both open, both verified keyless against the live
# services 2026-08-01. Specs are vendored because neither publisher ships a usable OpenAPI
# document for the operations this realm needs (AusTender documents its OCDS API in a GitHub
# README; the lobbyist register publishes a Swagger whose search POSTs return 500 to anonymous
# callers — only the two GETs vendored here actually answer without a session).

- url: austender-ocds.yaml
  name: austender
  type: openapi
  auth: none

- url: ag-lobbyists.yaml
  name: agLobbyists
  type: openapi
  auth: none

- url: brave.yaml
  name: brave
  type: openapi
  auth: api-key
  token-env: BRAVE_API_KEY

# Two sources. Both Commonwealth government, both open, both verified keyless against the live
# services 2026-08-01. Specs are vendored because neither publisher ships a usable OpenAPI
# document for the operations this realm needs (AusTender documents its OCDS API in a GitHub
# README; the lobbyist register publishes a Swagger whose search POSTs return 500 to anonymous
# callers — only the two GETs vendored here actually answer without a session).

- url: austender-ocds.yaml
  name: austender
  type: openapi
  auth: none

- url: ag-lobbyists.yaml
  name: agLobbyists
  type: openapi
  auth: none

- url: aph-handbook.yaml
  name: aphHandbook
  type: openapi
  auth: none

# Brave Search — the ONLY non-government source in this realm, and the only one behind a key.
# Vendored from realm-research (keep the two copies identical) so gov-au is self-contained rather
# than depending on another realm being installed. Used for ONE thing: independent press coverage
# of a contract's parties, which no government register carries.
#
# If BRAVE_API_KEY is absent the entry is skipped at load, the `brave` namespace does not exist,
# and the coverage lens reports the search as unavailable rather than guessing — the same
# degradation realm-nsw-property uses for Google Maps. Coverage is NEVER part of a register
# answer; it is a separate, clearly-labelled panel.
- url: brave.yaml
  name: brave
  type: openapi
  auth: api-key
  token-env: BRAVE_API_KEY

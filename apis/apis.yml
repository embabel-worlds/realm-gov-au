# Commonwealth sources, all open, all verified keyless against the live services (dates in each
# spec). Specs are vendored because no publisher here ships a usable OpenAPI document for the
# operations this realm needs (AusTender documents its OCDS API in a GitHub README; the lobbyist
# register publishes a Swagger whose search POSTs return 500 to anonymous callers — only the two
# GETs vendored here actually answer without a session; CKAN documents its action API in prose).

- url: austender-ocds.yaml
  name: austender
  type: openapi
  auth: none

- url: ag-lobbyists.yaml
  name: agLobbyists
  type: openapi
  auth: none

- url: data-gov-au-ckan.yaml
  name: dataGovAu
  type: openapi
  auth: none

- url: brave.yaml
  name: brave
  type: openapi
  auth: api-key
  token-env: BRAVE_API_KEY

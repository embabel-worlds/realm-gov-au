# GrantConnect published grant awards — the LAZY replacement for the deleted 5.7MB reference
# snapshot. One XLSX per requested publish-date range, fetched on first traversal, cached
# deployment-wide, re-downloaded on TTL. The GrantWindow key is `YYYY-MM-DD|YYYY-MM-DD`;
# numbered key tokens turn its two parts into the date format expected by GrantConnect.
#
# Verified live 2026-08-01: 7,064 grants / $4.98B for a 30-day window, 1.3MB.
# The export wants its dates as 01-Jul-2026 — the {keyN|date:} tokens render them.
#
# GOTCHA: the criteria banner is ~19 two-cell rows, which defeats modal-width header detection. This
# was a PINNED headerRow: 20 until it was caught returning nothing for any window over a year. The
# banner is not a fixed height — over GrantConnect's own 50,000-row cap the export inserts "Your
# search returned more than 50000 rows" plus a blank line, moving the header down two rows. The pin
# then landed on the notice row, its single cell became the only column, every projection below
# resolved to nothing, and the producer returned thousands of rows in which every field was null.
# Narrow windows stayed perfect, which is why it survived. The header is now found by CONTENT.
#
# The same cap is why truncationNotice is declared: over 50,000 matches the file arrives complete and
# well-formed and is a SUBSET, and only its own banner says so. Without this a 69,170-grant year is
# read as a confident 50,000-grant total. maxRows below is OUR ceiling; this is the source's.
- name: grantsPublishedByDate
  kind: tabular
  url: "https://www.grants.gov.au/Reports/GaPublishedDownload?AgencyStatus=0&DateType=Publish%20Date&DateStart={key1|date:dd-MMM-yyyy}&DateEnd={key2|date:dd-MMM-yyyy}"
  format: xlsx
  headerContains: "GA ID"
  truncationNotice: "returned more than"
  userAgent: browser
  # No keyColumn: the whole requested range IS the answer, stamped back to its composite key.
  keyAs: windowKey
  maxRows: 500000
  maxRowsPerKey: 500000
  project:
    agency: "Agency"
    gaId: "GA ID"
    goId: "GO ID"
    recipient: "Recipient Name"
    recipientAbn: "Recipient ABN"
    program: "Grant Program"
    activity: "Grant Activity"
    purpose: "Purpose"
    category: "Category"
    selectionProcess: "Selection Process"
    publishDate: "Publish Date"
    startDate: "Start Date"
    endDate: "End Date"
    value: "Value (AUD)"
    recipientPostcode: "Recipient Postcode"
    recipientState: "Recipient State/Territory"
    deliveryState: "Delivery State/Territory"
    deliveryPostcode: "Delivery Postcode"
  # The export writes dates as 7-Sep-2026 (day unpadded, month abbreviated). As text they neither
  # sort nor compare — 7-Sep-2026 sorts above 1-Jan-2027 — so they are rewritten to ISO yyyy-MM-dd
  # here. Measured over a week and a year of awards (over 150,000 dates): every value is d-MMM-yyyy
  # or dd-MMM-yyyy with an English three-letter month. An already-ISO value passes through
  # untouched; any other shape becomes ABSENT rather than a string that sorts wrongly.
  #
  # recipientAbn arrives spaced ('98 706 024 048') or as a sentinel ('ABN Exempt', 'Aggregate').
  # Digits-only is the form every other ABN in this realm takes, so it joins as is; a sentinel is
  # not an identifier and becomes absent.
  compute:
    publishDate: >-
      [p IN [split(trim(r.publishDate), '-')] WHERE size(p) = 3 |
              CASE WHEN size(p[0]) = 4 THEN trim(r.publishDate)
              ELSE p[2] + '-' + CASE toLower(p[1]) WHEN 'jan' THEN '01' WHEN 'feb' THEN '02' WHEN 'mar' THEN '03' WHEN 'apr' THEN '04' WHEN 'may' THEN '05' WHEN 'jun' THEN '06' WHEN 'jul' THEN '07' WHEN 'aug' THEN '08' WHEN 'sep' THEN '09' WHEN 'oct' THEN '10' WHEN 'nov' THEN '11' WHEN 'dec' THEN '12' END
                   + '-' + CASE size(p[0]) WHEN 1 THEN '0' + p[0] ELSE p[0] END END][0]
    startDate: >-
      [p IN [split(trim(r.startDate), '-')] WHERE size(p) = 3 |
              CASE WHEN size(p[0]) = 4 THEN trim(r.startDate)
              ELSE p[2] + '-' + CASE toLower(p[1]) WHEN 'jan' THEN '01' WHEN 'feb' THEN '02' WHEN 'mar' THEN '03' WHEN 'apr' THEN '04' WHEN 'may' THEN '05' WHEN 'jun' THEN '06' WHEN 'jul' THEN '07' WHEN 'aug' THEN '08' WHEN 'sep' THEN '09' WHEN 'oct' THEN '10' WHEN 'nov' THEN '11' WHEN 'dec' THEN '12' END
                   + '-' + CASE size(p[0]) WHEN 1 THEN '0' + p[0] ELSE p[0] END END][0]
    endDate: >-
      [p IN [split(trim(r.endDate), '-')] WHERE size(p) = 3 |
              CASE WHEN size(p[0]) = 4 THEN trim(r.endDate)
              ELSE p[2] + '-' + CASE toLower(p[1]) WHEN 'jan' THEN '01' WHEN 'feb' THEN '02' WHEN 'mar' THEN '03' WHEN 'apr' THEN '04' WHEN 'may' THEN '05' WHEN 'jun' THEN '06' WHEN 'jul' THEN '07' WHEN 'aug' THEN '08' WHEN 'sep' THEN '09' WHEN 'oct' THEN '10' WHEN 'nov' THEN '11' WHEN 'dec' THEN '12' END
                   + '-' + CASE size(p[0]) WHEN 1 THEN '0' + p[0] ELSE p[0] END END][0]
    recipientAbn: >-
      CASE WHEN size(replace(r.recipientAbn, ' ', '')) = 11
                AND toInteger(replace(r.recipientAbn, ' ', '')) IS NOT NULL
           THEN replace(r.recipientAbn, ' ', '') END
  fileCacheSeconds: 21600
  cache: { kind: ttl, seconds: 21600 }

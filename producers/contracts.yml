# RemoteRepositories over the AusTender OCDS feed.
#
# The feed serves exactly two access paths — by CN id and by date window — and its path params
# are filled by key-splitting (`keyArgs`), which implies one key per call. Everything else about
# these producers follows from two measured facts (2026-08-01, 200 consecutive releases):
#
#   1. `parties` is ALWAYS [supplier, procuringEntity] in that order with those single roles, and
#      `awards[0].suppliers[0].name` always names the supplier. The dotted-numeric projections
#      below (parties.0.name, parties.1.name) depend on that order; the interpreter resolves a
#      numeric segment as an array index (bracket form Location[0] does NOT work — see the NSW
#      realm's measured warning). If AusTender ever varies party order these projections misfile
#      supplier and agency, so the order is asserted in the spec and should be re-measured on any
#      upstream change.
#
#   2. ABNs (additionalIdentifiers, scheme AU-ABN) are present on MOST parties, not all. An
#      absent supplierAbn is a register fact, not a fetch failure, and never worth a warning.
#
# Paging: the next cursor exists ONLY inside links.next as a full URL; cursorPath points at the
# URL and the walker extracts the `cursor` query parameter (PagingSpec.resolveCursor). The engine
# always sends a page-size arg; this feed has no such parameter, so sizeParam is named `pageSize`
# — verified ignored by the service (identical TotalCount with and without it).

- name: versionsById
  kind: remote
  operation: findContractNoticeById
  records: "$.releases[*]"
  keyArgs: [cnid]
  echoKeyAs: cnKeyEcho   # findById already returns cnId on every record; echo kept for join safety
  # No paging: findById returns the whole version chain in one response (a CN with >100 versions
  # does not exist in this register — the largest observed chains are single digits).
  project:
    releaseId: id
    cnId: "contracts.0.id"
    releaseDate: date
    tags: "tag[*]"
    amendmentIds: "contracts.0.amendments[*].id"
    title: "contracts.0.title"
    description: "contracts.0.description"
    amount: "contracts.0.value.amount"
    currency: "contracts.0.value.currency"
    dateSigned: "contracts.0.dateSigned"
    startDate: "contracts.0.period.startDate"
    endDate: "contracts.0.period.endDate"
    supplierName: "awards.0.suppliers.0.name"
    supplierAbn: "parties.0.additionalIdentifiers.0.id"
    agencyName: "parties.1.name"
    agencyAbn: "parties.1.additionalIdentifiers.0.id"
    supplierLocality: "parties.0.address.locality"
    supplierRegion: "parties.0.address.region"
    supplierPostcode: "parties.0.address.postalCode"
    procurementMethod: "tender.procurementMethod"
    procurementMethodDetails: "tender.procurementMethodDetails"
    limitedTenderReason: "tender.limitedTenderReason"
    # The CODES are the join keys to the seeded ProcurementGround nodes; the text is what the
    # register said. Project both — the code makes the ground countable, the text keeps the
    # answer quotable without a second lookup.
    limitedTenderReasonCode: "tender.limitedTenderReasonCode"
    exemption: "tender.exemption"
    exemptionCode: "tender.exemptionCode"
    unspscCodes: "contracts.0.items[*].classification.id"
    # Same additions as versionsById above, same measured caveats — contactDivision is the CONTACT
    # OFFICER'S unit (a command for Defence, a procurement branch elsewhere), awardDate is the
    # PUBLICATION instant that reveals batch uploads, and contactPoint name/email/telephone are
    # deliberately excluded as personal data.
    contactDivision: "parties.0.contactPoint.division"
    awardDate: "awards.0.date"
    awardId: "awards.0.id"
    contractStatus: "contracts.0.status"
    limitedTenderExempt: "tender.limitedTenderExempt"
    # Fields the feed always carried and this realm discarded. Measured over 300 live releases
    # across three publication days (not one — the first day sampled was 100% Defence, which
    # flattered every number below):
    #
    #   contactDivision   209/300. The CONTACT OFFICER'S unit as published, and named for what it
    #                     is rather than a "buying unit": for Defence it is the command that bought
    #                     the thing (CASG, NSSG, JCG, ARMY), for other agencies it is the officer's
    #                     own branch ('PROCUREMENT AND CONTRACT MANAG' — truncated at 30 chars AT
    #                     SOURCE). So it is finer-grained attribution than agencyName for Defence
    #                     and near-useless elsewhere; a view must not treat it as "who bought it".
    #                     Sits on the SUPPLIER party in the feed while its values are agency-side —
    #                     a source quirk, not a mis-projection here.
    #   awardDate         300/300, to the second. Distinct from dateSigned: it is when the award was
    #                     PUBLISHED, and consecutive notices arriving 23:57:59 / 23:58:00 / 23:58:01
    #                     are one machine upload — the batch shape, readable only from this field.
    #   contractStatus    300/300 ('active' throughout the sample; a terminated or expired contract
    #                     is invisible to this realm today).
    #   awardId           the award this contract sits under, so contract↔award is joinable.
    #   limitedTenderExempt  a flag the register sets beside the reason codes we already read.
    #
    # DELIBERATELY NOT PROJECTED: contactPoint.name / .email / .telephone. `.name` carries REAL
    # INDIVIDUAL NAMES (34 of those 300 releases are person-shaped, one an identifiable officer at a
    # small agency), and email/telephone are personal contact details. None of them is needed to
    # answer a question about public money, so none of them enters the graph.
    contactDivision: "parties.0.contactPoint.division"
    awardDate: "awards.0.date"
    awardId: "awards.0.id"
    contractStatus: "contracts.0.status"
    limitedTenderExempt: "tender.limitedTenderExempt"
  # Notices amend on business days; an hour's TTL keeps a repeated passport instant. An unknown
  # CN id returns an EMPTY release list — that emptiness is an answer (the id does not exist in
  # the register) and is cached as one.
  cache: { kind: ttl, seconds: 3600, negativeTtlSeconds: 3600 }
  cost:
    bucket: "austender"
    rate: "3/sec"
    yield: high

- name: releasesPublishedInWindow
  kind: remote
  operation: findContractsPublishedBetween
  records: "$.releases[*]"
  # The anchor key is 'from/to' in ISO instants — '2026-07-01T00:00:00Z/2026-07-28T00:00:00Z'.
  # ISO instants contain no '/', so the default split is unambiguous.
  keyArgs: [from, to]
  echoKeyAs: publishedWindow
  # 100 releases/page, cursor-paged. With daily partitioning below, maxPages 12 = 1,200 releases
  # is a PER-DAY budget — comfortably above the busiest measured day (~100-400/business day;
  # end-of-financial-year spikes are the case to watch). A single day that still caps surfaces
  # the walker's TRUNCATED warning NAMING that day — lenses must carry it into their status.
  paging: { style: cursor, cursorParam: cursor, cursorPath: "$.links.next", size: 100, sizeParam: pageSize, maxPages: 12 }
  # AusTender answers an EMPTY day with HTTP 400 "No Records found for Date Range" — with daily
  # partitioning that is every quiet weekend, and it is an answer, not an error.
  emptyErrorPatterns: ["No Records found"]
  # The feed returns newest-first and caps per request, so an unpartitioned broad window
  # silently returned only its newest ~1,200 notices — a result that LOOKS like a recent window.
  # Partitioning fetches each UTC day with its own page budget and stamps records back to the
  # caller's window; queries and the app change not at all.
  partition: { unit: day, maxUnits: 366 }
  project:
    releaseId: id
    cnId: "contracts.0.id"
    releaseDate: date
    tags: "tag[*]"
    title: "contracts.0.title"
    description: "contracts.0.description"
    amount: "contracts.0.value.amount"
    currency: "contracts.0.value.currency"
    dateSigned: "contracts.0.dateSigned"
    startDate: "contracts.0.period.startDate"
    endDate: "contracts.0.period.endDate"
    supplierName: "awards.0.suppliers.0.name"
    supplierAbn: "parties.0.additionalIdentifiers.0.id"
    agencyName: "parties.1.name"
    agencyAbn: "parties.1.additionalIdentifiers.0.id"
    supplierLocality: "parties.0.address.locality"
    supplierRegion: "parties.0.address.region"
    supplierPostcode: "parties.0.address.postalCode"
    procurementMethod: "tender.procurementMethod"
    procurementMethodDetails: "tender.procurementMethodDetails"
    limitedTenderReason: "tender.limitedTenderReason"
    # The CODES are the join keys to the seeded ProcurementGround nodes; the text is what the
    # register said. Project both — the code makes the ground countable, the text keeps the
    # answer quotable without a second lookup.
    limitedTenderReasonCode: "tender.limitedTenderReasonCode"
    exemption: "tender.exemption"
    exemptionCode: "tender.exemptionCode"
    unspscCodes: "contracts.0.items[*].classification.id"
    # Same additions as versionsById above, same measured caveats — contactDivision is the CONTACT
    # OFFICER'S unit (a command for Defence, a procurement branch elsewhere), awardDate is the
    # PUBLICATION instant that reveals batch uploads, and contactPoint name/email/telephone are
    # deliberately excluded as personal data.
    contactDivision: "parties.0.contactPoint.division"
    awardDate: "awards.0.date"
    awardId: "awards.0.id"
    contractStatus: "contracts.0.status"
    limitedTenderExempt: "tender.limitedTenderExempt"
  # A closed window's contents never change; an open one gains releases through the business day.
  cache: { kind: ttl, seconds: 3600 }
  cost:
    bucket: "austender"
    rate: "3/sec"
    yield: high

- name: releasesModifiedInWindow
  kind: remote
  operation: findContractsModifiedBetween
  records: "$.releases[*]"
  keyArgs: [from, to]
  echoKeyAs: changedWindow
  # Same shape and caps as the published window; this is the feed where amendment releases
  # (tag contractAmendment) surface, so it is the entry point for every "what changed" question.
  # NOTE the completeness caveat: this feed filters on LAST-MODIFIED, a mutable attribute, so a
  # partitioned scan is complete AS OF the scan — a later amendment moves the release forward.
  paging: { style: cursor, cursorParam: cursor, cursorPath: "$.links.next", size: 100, sizeParam: pageSize, maxPages: 12 }
  # AusTender answers an EMPTY day with HTTP 400 "No Records found for Date Range" — with daily
  # partitioning that is every quiet weekend, and it is an answer, not an error.
  emptyErrorPatterns: ["No Records found"]
  partition: { unit: day, maxUnits: 366 }
  project:
    releaseId: id
    cnId: "contracts.0.id"
    releaseDate: date
    tags: "tag[*]"
    title: "contracts.0.title"
    description: "contracts.0.description"
    amount: "contracts.0.value.amount"
    currency: "contracts.0.value.currency"
    dateSigned: "contracts.0.dateSigned"
    startDate: "contracts.0.period.startDate"
    endDate: "contracts.0.period.endDate"
    supplierName: "awards.0.suppliers.0.name"
    supplierAbn: "parties.0.additionalIdentifiers.0.id"
    agencyName: "parties.1.name"
    agencyAbn: "parties.1.additionalIdentifiers.0.id"
    supplierLocality: "parties.0.address.locality"
    supplierRegion: "parties.0.address.region"
    supplierPostcode: "parties.0.address.postalCode"
    procurementMethod: "tender.procurementMethod"
    procurementMethodDetails: "tender.procurementMethodDetails"
    limitedTenderReason: "tender.limitedTenderReason"
    # The CODES are the join keys to the seeded ProcurementGround nodes; the text is what the
    # register said. Project both — the code makes the ground countable, the text keeps the
    # answer quotable without a second lookup.
    limitedTenderReasonCode: "tender.limitedTenderReasonCode"
    exemption: "tender.exemption"
    exemptionCode: "tender.exemptionCode"
    unspscCodes: "contracts.0.items[*].classification.id"
    # Same additions as versionsById above, same measured caveats — contactDivision is the CONTACT
    # OFFICER'S unit (a command for Defence, a procurement branch elsewhere), awardDate is the
    # PUBLICATION instant that reveals batch uploads, and contactPoint name/email/telephone are
    # deliberately excluded as personal data.
    contactDivision: "parties.0.contactPoint.division"
    awardDate: "awards.0.date"
    awardId: "awards.0.id"
    contractStatus: "contracts.0.status"
    limitedTenderExempt: "tender.limitedTenderExempt"
  cache: { kind: ttl, seconds: 3600 }

# The AIS 2024 PROGRAMS companion file keyed by the ACNC's own program CLASSIFICATION — the
# register's self-declared answer to "what does this charity actually do". 104,482 program rows
# across 53k charities; the disability-relevant classes measured 2026-08-02: Disability services
# (1,469), Disability sports (275), Family disability resources (155), Housing for people with
# disabilities (143), Disabled persons' rights (102). This is what separates "serves people with
# disabilities among others" (a hospital, a university — the beneficiary flag) from "runs a
# disability-services program" (the NDIS-proximate slice). maxRowsPerKey covers the largest
# published class (Christianity, 8,814 rows).
- name: programsByClassification
  kind: tabular
  url: "https://data.gov.au/data/dataset/276ec1bc-4971-461c-88bc-be9f3c99a0f8/resource/09f5fc83-8648-413e-ba5b-793a9d6b305f/download/datadotgov_ais24_programs.csv"

# The integrity registers — the adverse-conduct sources a federal debarment register would hold,
# if one existed. It does not (CPR 6.9 replaces it with tenderer SELF-DECLARATION), which is why
# these joins exist. All keyless `tabular` sources, ABN-keyed with `digits` matching because the
# same ABN is published spaced, unspaced, numeric and float across this estate.
#
# Verified live 2026-08-01 (status, size, header) — see docs/INTEGRITY-SOURCES.md for the sources
# assessed and NOT included yet (WGEA: zip/PDF; ABF: POST-only JSON; Payment Times: scraped
# filename) and what unblocks each.

# NDIS Commission compliance actions — banning orders, revocations, suspensions. 3,333 rows,
# 83% with clean ABN, WITH effective-from/to dates: the only adverse register that supports a
# TEMPORAL overlap check against a contract's own dates.
# GOTCHA (research-verified): the Commission publishes SNAPSHOT datasets — this URL is the
# 06.07.2026 snapshot and a newer slug will eventually supersede it. The lens carries the
# snapshot date so staleness is visible, never silent.
- name: ndisActionsByAbn
  kind: tabular
  url: "https://data.gov.au/data/dataset/4ad8bb94-1982-43ff-a030-d6587b9aa460/resource/8a6ce1fc-8f92-44ad-9c9d-2290dab7ee4f/download/ndis-commission-compliance-actions-06.07.2026.csv"
  keyColumn: "ABN"
  keyMatch: digits
  keyAs: abn
  rowIdAs: recordKey
  project:
    register: "Type"
    name: "Name"
    dateFrom: "Date effective from"
    dateTo: "Date no longer in force"
    state: "State"
    # MEASURED 2026-08-02: the narrative lives in "Relevant information" (99% filled); the
    # similarly-named "Other relevant info" column is ~0% filled in EVERY snapshot Feb-Jul 2026.
    # This previously projected the dead column, so every consuming lens showed detail: null.
    detail: "Relevant information"
  fileCacheSeconds: 86400
  cache: { kind: ttl, seconds: 21600, negativeTtlSeconds: 21600 }

# ── The register as a TIME SERIES (docs/adr/0001) ──────────────────────────────────────────────
# The Commission publishes the compliance register as dated CATALOGUE EXTRACTS — one data.gov.au
# dataset per date, eight for Feb-Jul 2026 — and each shows CURRENT STATE only. Diffing extracts
# is the only way to see when an action APPEARED and, the signal nobody tracks, when one
# DISAPPEARED. Two producers carry that: the catalogue search enumerates the extracts (so a new
# one is found the day it is published, not when this file is edited), and the snapshot-rows
# producer returns any one extract WHOLE.

# data.gov.au catalogue search — the generic "does this source exist / what extracts are there"
# probe, elevated to a producer because the ADR's method rule (query the catalogue before
# concluding a source does not exist) kept being right. Key = a quoted dataset-title phrase.
- name: datasetCatalogue
  kind: remote
  operation: searchDatasets
  records: "$.result.results[*]"
  # The key is sent QUOTED: CKAN's Solr treats unquoted words as OR and answers a title-phrase
  # search with dozens of unrelated datasets (measured: 49 rows for the NDIS phrase unquoted,
  # 8 quoted). echoKeyAs stamps the caller's ORIGINAL phrase back, so the quoting never re-keys
  # the join.
  keyTemplate: '"{key}"'
  echoKeyAs: query
  args: { q: "{keys}", rows: 60 }
  project:
    title: title
    datasetId: id
    publisher: "organization.title"
    licenseId: license_id
    metadataModified: metadata_modified
    resourceId: "resources.0.id"
    resourceUrl: "resources.0.url"
    resourceFormat: "resources.0.format"
    resourceBytes: "resources.0.size"
  # The catalogue changes when a publisher acts, which is business days at most.
  cache: { kind: ttl, seconds: 21600, negativeTtlSeconds: 21600 }

# One compliance-register extract, WHOLE. The key is the extract's identity in the catalogue —
# 'datasetId|resourceId|filename' as returned by datasetCatalogue — so this producer can fetch
# ANY extract in the series without a YAML edit per date. No keyColumn: the anchor pins a
# snapshot, and every row of that snapshot comes back stamped with it (maxRowsPerKey bounds the
# whole-file return; the register was 3,333 rows at 06.07.2026 and growing ~200/month, so 12000
# is years of headroom, and hitting it surfaces as an honest TRUNCATED warning).
# Projection is pinned to the columns STABLE across all measured snapshots — 'Registration
# Groups ' grew/lost a trailing space between extracts and 'Provider Number' is 1-2% filled, so
# neither is projected. Date formats CHANGE across extracts (dd/mm/yyyy hh:mm in Feb, ISO by
# Jul) — consumers must day-normalize both, and the diff lens does.
- name: ndisActionsSnapshotRows
  kind: tabular
  url: "https://data.gov.au/data/dataset/{key1}/resource/{key2}/download/{key3}"
  keyAs: snapshotKey
  rowIdAs: rowKey
  maxRowsPerKey: 12000
  project:
    register: "Type"
    name: "Name"
    abn: "ABN"
    city: "City"
    state: "State"
    postcode: "Postcode"
    dateFrom: "Date effective from"
    dateTo: "Date no longer in force"
    detail: "Relevant information"
  # Extracts are immutable once published (a NEW date is a NEW dataset), so cache long; the
  # negative case (a bad key) is a misread catalogue row, worth re-checking sooner.
  fileCacheSeconds: 604800
  cache: { kind: ttl, seconds: 86400, negativeTtlSeconds: 21600 }

# Modern Slavery Statements Register — the bulk export, re-stamped daily with today's date in the
# filename ({today} resolves it). PRESENCE here is a lodgement (usually good); the lens's signal
# is the NEGATIVE join — a threshold-scale supplier with no statement at all.
# LIMIT: joint statements pack several ABNs into one cell; digits-matching cannot split a packed
# cell, so a joint-statement member may read as unlodged. Stated in every consuming lens.
- name: slaveryStatementsByAbn
  kind: tabular
  url: "https://modernslaveryregister.gov.au/resources/all-statement-information_{today}.csv"
  keyColumn: "ABN"
  keyMatch: digits
  keyAs: abn
  project:
    periodStart: "PeriodStart"
    periodEnd: "PeriodEnd"
    kind: "Type"
    entities: "ReportingEntities"
    link: "Link"
  fileCacheSeconds: 86400
  cache: { kind: ttl, seconds: 21600, negativeTtlSeconds: 21600 }

# ATO corporate tax transparency 2023-24 — 4,198 entities with total income ≥ $100M. CC-BY.
# THE published caveat that every consumer must carry: legislation FORBIDS reporting an amount
# of zero or less, so a BLANK taxable-income / tax-payable is "≤ 0", never "unknown". And the
# report is entity-level, NOT consolidated groups — the contracting entity often differs from
# the reporting entity.
- name: taxRecordByAbn
  kind: tabular
  url: "https://data.gov.au/data/dataset/c2524c87-cea4-4636-acac-599a82048a26/resource/491b366b-aa6f-4b1c-b39d-cebaeeb6f874/download/2023-24-corporate-report-of-entity-tax-information.xlsx"
  format: xlsx
  sheet: "Income tax details"
  keyColumn: "ABN"
  keyMatch: digits
  keyAs: abn
  project:
    name: "Name"
    totalIncome: "Total income $"
    taxableIncome: "Taxable income $"
    taxPayable: "Tax payable $"
    incomeYear: "Income year"
  fileCacheSeconds: 604800
  cache: { kind: ttl, seconds: 86400, negativeTtlSeconds: 86400 }

# ── ACNC Register of Australian Charities ──────────────────────────────────────────────────────
# The register that makes a provider NETWORK possible. ASIC's company dataset carries no address
# and no officers, so shared-premises clustering is impossible for companies — but a large share
# of NDIS and disability providers are registered charities, and the ACNC register publishes the
# FULL STREET ADDRESS against the ABN. 14 MB, one file, no credentials.
#
# It also carries Registration_Date and Date_Organisation_Established, which give entity AGE at
# the moment money was awarded WITHOUT the 379 MB ASIC company extract, and a
# People_with_Disabilities beneficiary flag that isolates the sector.
#
# Number_of_Responsible_Persons is a COUNT, never names — no open Australian source publishes
# director or responsible-person names in bulk, so a shared-officer graph remains impossible and
# every consuming lens must say so rather than implying one.
- name: charityByAbn
  kind: tabular
  url: "https://data.gov.au/data/dataset/b050b242-4487-4306-abf5-07ca073e5594/resource/8fb32972-24e9-4c95-885e-7140be51be8a/download/datadotgov_main.csv"
  keyColumn: "ABN"
  keyMatch: digits
  keyAs: abn
  project:
    charityName: "Charity_Legal_Name"
    otherNames: "Other_Organisation_Names"
    addressLine1: "Address_Line_1"
    addressLine2: "Address_Line_2"
    town: "Town_City"
    state: "State"
    postcode: "Postcode"
    website: "Charity_Website"
    registrationDate: "Registration_Date"
    established: "Date_Organisation_Established"
    charitySize: "Charity_Size"
    responsiblePersons: "Number_of_Responsible_Persons"
    servesPeopleWithDisabilities: "People_with_Disabilities"
  fileCacheSeconds: 604800
  cache: { kind: ttl, seconds: 21600, negativeTtlSeconds: 21600 }

# The SAME file keyed by the ACNC's own People_with_Disabilities beneficiary flag ('Y' or
# blank), so one anchor enumerates the whole disability-serving slice of the register — 16,035
# of 66,012 charities measured 2026-08-02. This is the candidate roll for the provider-ledger
# join (docs/adr/0001): the flag is the ACNC's registration-time classification, and 'not
# flagged' means not classified so, never 'not a disability provider'. Shares the deployment
# file cache with charityByAbn — same URL, one download.
- name: charitiesServingDisabilities
  kind: tabular
  url: "https://data.gov.au/data/dataset/b050b242-4487-4306-abf5-07ca073e5594/resource/8fb32972-24e9-4c95-885e-7140be51be8a/download/datadotgov_main.csv"
  keyColumn: "People_with_Disabilities"
  keyMatch: ci
  keyAs: marker
  rowIdAs: rollKey
  maxRowsPerKey: 30000
  project:
    abn: "ABN"
    charityName: "Charity_Legal_Name"
    otherNames: "Other_Organisation_Names"
    town: "Town_City"
    state: "State"
    postcode: "Postcode"
    registrationDate: "Registration_Date"
    established: "Date_Organisation_Established"
    charitySize: "Charity_Size"
  fileCacheSeconds: 604800
  cache: { kind: ttl, seconds: 21600, negativeTtlSeconds: 21600 }

# ── ACNC Annual Information Statement 2024 — the reconstructed ledger (docs/adr/0001) ──────────
# Per ABN for FY24: self-reported revenue from government, goods-and-services revenue, staff
# (headcounts AND total FTE), employee expenses, grants the charity itself made, and the
# self-declared related-party-transactions flag. This is the closest thing to a per-provider
# NDIS ledger Australian open data offers: self-reported government revenue MINUS the published
# Commonwealth registers leaves a residual that, for a disability provider, is largely NDIS and
# state money. Every consumer carries: SELF-reported, lagged (FY24), charities only, small
# charities file reduced detail, and NDIS fee-for-service may be booked under goods-and-services
# rather than government — which line a provider uses is itself informative.
# 53,763 rows, 100% clean 11-digit ABN, all money/staff columns 100% filled (measured
# 2026-08-02). The catalogue holds one dataset per year back to 2013 (datadotgov_ais13..24) —
# prior years are a documented extension, not yet consumed.
- name: aisReturnByAbn
  kind: tabular
  url: "https://data.gov.au/data/dataset/276ec1bc-4971-461c-88bc-be9f3c99a0f8/resource/710630ea-1202-4bbb-95f7-3973a972ddf8/download/datadotgov_ais24.csv"
  keyColumn: "abn"
  keyMatch: digits
  keyAs: abn
  rowIdAs: aisKey
  project:
    charityName: "charity name"
    registrationStatus: "registration status"
    charitySize: "charity size"
    reportingPeriodFrom: "fin report from"
    reportingPeriodTo: "fin report to"
    statementType: "type of financial statement"
    purposesPursued: "how purposes were pursued"
    consolidated: "report consolidated with more than one entity"
    staffFullTime: "staff - full time"
    staffPartTime: "staff - part time"
    staffCasual: "staff - casual"
    staffVolunteers: "staff - volunteers"
    fteTotal: "total full time equivalent staff"
    employeeExpenses: "employee expenses"
    revenueGovernment: "revenue from government"
    revenueGoodsServices: "revenue from goods and services"
    donationsBequests: "donations and bequests"
    revenueTotal: "total revenue"
    grossIncomeTotal: "total gross income"
    grantsMadeAustralia: "grants and donations made for use in Australia"
    grantsMadeOverseas: "grants and donations made for use outside Australia"
    otherExpenses: "all other expenses"
    expensesTotal: "total expenses"
    netSurplus: "net surplus/deficit"
    relatedPartyTransactions: "charity has reportable related party transactions"
  fileCacheSeconds: 604800
  cache: { kind: ttl, seconds: 86400, negativeTtlSeconds: 86400 }

# The FY2023 PROGRAMS file, keyed the same way — so "who declared a disability program LAST year
# and does not this year" is answerable inside one taxonomy, rather than by a filter derived from
# the very file that would exclude the answer. 98,320 program rows; 1,350 ABNs under the
# disability classes, 129 of them absent from FY24 (measured 2026-08-03).
- name: priorProgramsByClassification
  kind: tabular
  url: "https://data.gov.au/data/dataset/ff6905d6-9d5d-4ef1-8478-72b833864fb7/resource/1fc1ecea-b9ec-45e4-a4f8-090ba2912e14/download/datadotgov_ais23_programs.csv"
  keyColumn: "Classification"
  keyMatch: ci
  keyAs: classification
  rowIdAs: programKey
  maxRowsPerKey: 12000
  project:
    abn: "ABN"
    charityName: "Charity Name"
    registrationStatus: "Registration Status"
    programName: "Program name"
  fileCacheSeconds: 604800
  cache: { kind: ttl, seconds: 86400, negativeTtlSeconds: 86400 }

# The FY24 programs file keyed by ABN — one charity's WHOLE declared program mix. Without it a
# screened row misleads: an entity flagged through its disability program may earn most of its
# government revenue from aged care or homelessness services, and the AIS reports one revenue
# figure for all of it. Measured case: a $29.1M "government revenue" entity with 2 FTE whose
# programs are Home Care Packages, meals and aged day care ALONGSIDE disability care — brokered
# home care explains the shape, and only the program mix shows it.
- name: programsByAbn
  kind: tabular
  url: "https://data.gov.au/data/dataset/276ec1bc-4971-461c-88bc-be9f3c99a0f8/resource/09f5fc83-8648-413e-ba5b-793a9d6b305f/download/datadotgov_ais24_programs.csv"
  keyColumn: "ABN"
  keyMatch: digits
  keyAs: abn
  rowIdAs: programKey
  maxRowsPerKey: 60
  project:
    charityName: "Charity Name"
    programName: "Program name"
    classification: "Classification"
  fileCacheSeconds: 604800
  cache: { kind: ttl, seconds: 86400, negativeTtlSeconds: 86400 }


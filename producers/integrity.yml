  maxRowsPerKey: 12000
  project:
    abn: "ABN"
    charityName: "Charity Name"
    registrationStatus: "Registration Status"
    programName: "Program name"
  fileCacheSeconds: 604800
  cache: { kind: ttl, seconds: 86400, negativeTtlSeconds: 86400 }

# The SAME file keyed by POSTCODE, so a lens can ask "who else is registered around here" and
# cluster on the address itself. Keyed on postcode rather than the address line because an
# address is written a dozen ways ('73 Taylor St' / 'Suite 2, 73 Taylor Street') and only the
# lens can normalize it; postcode is a clean column and bounds the candidate set cheaply.
# The deployment file cache is shared with charityByAbn — same URL, one download.
- name: charitiesByPostcode
  kind: tabular
  url: "https://data.gov.au/data/dataset/b050b242-4487-4306-abf5-07ca073e5594/resource/8fb32972-24e9-4c95-885e-7140be51be8a/download/datadotgov_main.csv"
  keyColumn: "Postcode"
  keyMatch: digits
  keyAs: postcode
  rowIdAs: charityKey
  project:
    abn: "ABN"
    charityName: "Charity_Legal_Name"
    otherNames: "Other_Organisation_Names"
    addressLine1: "Address_Line_1"
    addressLine2: "Address_Line_2"
    town: "Town_City"
    state: "State"

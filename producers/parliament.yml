# Parliamentary mentions — DIRECT ParlInfo search feeds (keyless RSS, verified live 2026-08-01),
# one producer per record class so a lens can say exactly which part of the record it searched:
#
#   - chamber Hansard (House + Senate debates)
#   - committee evidence (Senate + joint committees)
#   - Senate Estimates transcripts — THE accountability venue for procurement
#   - Estimates within a DATE RANGE (composite key: phrase|fromIso|toIso) — "was this supplier
#     before Estimates DURING the contract period?" is a temporal join, not a vibe.
#
# ParlInfo signals ZERO RESULTS with a 301 to an error page (verified with a nonsense term);
# `redirectMeansEmpty: true` maps that to an honest empty — never a failure, never followed.
# The engine's feed guardrails apply: ≤25 keys per fetch, capped items and bytes, paced ≥1s here
# (the register is a shared public service; we are polite by declaration, floored by the engine).
#
# Known gap: Questions on Notice as a standalone dataset — qon/qanda/qonsw all error as sole
# datasets (probed live). QoN citations still surface through committee documents; the dataset
# name is an open item in docs/PARLIAMENT.md.

- name: hansardChamberMentions
  kind: feed
  url: 'https://parlinfo.aph.gov.au/parlInfo/feeds/rss.w3p;query=Dataset:hansardr,hansards Content:"{key}"'
  redirectMeansEmpty: true
  keyAs: searchPhrase
  maxItems: 8
  userAgent: browser
  minIntervalMs: 1000
  cache: { kind: ttl, seconds: 3600, negativeTtlSeconds: 3600 }

- name: committeeMentions
  kind: feed
  url: 'https://parlinfo.aph.gov.au/parlInfo/feeds/rss.w3p;query=Dataset:commsen,commjnt Content:"{key}"'
  redirectMeansEmpty: true
  keyAs: searchPhrase
  maxItems: 8
  userAgent: browser
  minIntervalMs: 1000
  cache: { kind: ttl, seconds: 3600, negativeTtlSeconds: 3600 }

- name: estimatesMentions
  kind: feed
  url: 'https://parlinfo.aph.gov.au/parlInfo/feeds/rss.w3p;query=Dataset:estimate Content:"{key}"'
  redirectMeansEmpty: true
  keyAs: searchPhrase
  maxItems: 8
  userAgent: browser
  minIntervalMs: 1000
  # FOLLOW the top transcripts and keep phrase-anchored excerpts — the actual exchanges, with
  # ParlInfo's speaker attribution intact ("Senator ROBERTS: …"). This is what lets a summarize
  # over m.content honestly say WHAT was discussed and BY WHOM, instead of reading titles.
  follow: { maxPages: 3, match: "{key}", excerptChars: 4000 }
  cache: { kind: ttl, seconds: 3600, negativeTtlSeconds: 3600 }

# Composite key `phrase|fromIso|toIso`; the date parts render in ParlInfo's own dd/MM/yyyy.
- name: estimatesMentionsInPeriod
  kind: feed
  url: 'https://parlinfo.aph.gov.au/parlInfo/feeds/rss.w3p;query=Dataset:estimate Content:"{key1}" Date:{key2|date:dd/MM/yyyy} >> {key3|date:dd/MM/yyyy}'
  redirectMeansEmpty: true
  keyAs: searchPhrase
  maxItems: 8
  userAgent: browser
  minIntervalMs: 1000
  # match {key1}: excerpts anchor on the PHRASE part of the composite key, never its dates.
  follow: { maxPages: 3, match: "{key1}", excerptChars: 4000 }
  cache: { kind: ttl, seconds: 3600, negativeTtlSeconds: 3600 }
